# 共享分析上下文 — Phase A 产出。写入磁盘后是进入 Phase B 的硬性前提。
# Phase B Agent 将此文件内联在 prompt 中直接使用，禁止重新分析。
# 所有 <...> 占位符在 Phase A 执行时替换为实际值。

# --------------------------------------------------
# 1. 响应包装器（Phase A3 填充）
# --------------------------------------------------
response_wrappers:

  R:
    description: "<R 包装类的全限定名，如 org.xxx.common.core.domain.R<T>>"
    success_code: <R.ok() 的 code 值，通常是 200>
    success_message: "<R.ok() 的 message 值，如 '操作成功'>"
    fail_code: <R.fail(msg) 的默认 code 值，通常是 500>
    fail_message: "<R.fail() 的默认 message 值，如 '操作失败'>"
    code_field: <响应 JSON 中 code 字段名，如 code>
    msg_field: <响应 JSON 中 message 字段名，如 msg>
    data_field: <响应 JSON 中 data 字段名，如 data>
    note: "<从 Controller return → 工厂方法 → 构造器 追踪得出的正向 code/message 总结>"

  TableDataInfo:
    description: "<分页包装类的全限定名，如 org.xxx.common.core.page.TableDataInfo<T>>"
    success_code: <构建时的 code 值，通常是 200>
    success_message: "<构建时的 message 值，如 '查询成功'>"
    fail_code: <失败 code 值，通常是 500>
    fail_message: "<失败 message 值，如 '查询失败'>"
    code_field: <响应 JSON 中 code 字段名>
    msg_field: <响应 JSON 中 message 字段名>
    structure: "<响应 JSON 结构，如 { code, msg, total, rows }>"
    note: "<BaseController 中哪些方法使用此包装器，Phase B Agent 据此决定 business_message>"

  # Phase A5 填充：校验异常的 message 拼接方式，决定 Phase B 使用 exact 还是 contains 模式
  validation_message_mode: "<single | concatenated>"
  # single: 校验异常消息只包含单个字段的校验信息（如 "用户名不能为空"）
  # concatenated: 校验异常消息会拼接多个字段的信息（如 "用户名不能为空, 认证客户端id不能为空"）

# --------------------------------------------------
# 2. 认证配置（Phase A4 填充）
# --------------------------------------------------
auth:
  type: <安全框架类型，如 sa-token / spring-security / shiro / 自定义>
  login_endpoint: <登录接口路径（仅路径），禁止带 HTTP 方法前缀>
  token_header: <认证 header 名>
  token_prefix: "<token 前缀，无前缀则空字符串 ''>"
  token_response_path: <token JSONPath。⚠️ [REQUIRED] 必须 Read 登录响应 VO 源码按 @JsonProperty 确定 JSON 键名。Phase B Agent 必须将此字段写入每个模块 YAML，禁止依赖框架默认值>
  response_msg_field: <响应包装类消息字段名，与 §1 中 R.msg_field 一致>
  # fixture_extracts — 从登录响应提取的变量，供 global_headers 通过 ${变量名} 引用
  # ⚠️ [REQUIRED] fixture_extracts 必须在 auth 段内，不可放在 YAML 顶层
  # 每个条目的 JSONPath 字段名必须 Read 登录响应 VO 源码，按 @JsonProperty 注解确定
  fixture_extracts: {}
    # <变量名>: "<JSONPath>"
  # 测试账号 — Phase A1 从 config.yaml 原样复制
  accounts: {}
    # <role>:
    #   <key1>: <value1>
    #   <key2>: <value2>
  note: "<框架特性说明：如何读取 token、免认证路径的注解或配置方式>"

# --------------------------------------------------
# 3. 全局请求头（Phase A4 填充）
#    列表包含所有 API 请求必须携带的 header
# --------------------------------------------------
global_headers:
  # 主认证头（必有）
  - name: <认证 header 名，与 §2 token_header 一致>
    value: "<token_prefix>${token}"          # value 必须拼接 token_prefix
    required: true
    description: "<认证说明，如 '认证Token'>"

  # 跨字段校验头（若 Phase A4 发现则追加，无则删除此条及以下注释）
  # - name: <跨字段校验的 header 名>
  #   value: "${<fixture_extracts 变量名>}"
  #   required: true
  #   description: "<校验说明>"

# --------------------------------------------------
# 4. 错误码速查表（Phase A3 + A5 填充）
# --------------------------------------------------
error_codes:

  auth_fail:
    description: "<异常处理器类名.方法名，处理认证失败异常>"
    status_code: <HTTP 状态码，检查 @ResponseStatus 注解，无则默认 200>
    business_code: <R.fail(code, msg) 的 code 参数值>
    business_message: "<R.fail(code, msg) 的 msg 参数值>"

  permission_fail:
    description: "<异常处理器类名.方法名，处理权限不足异常>"
    status_code: <HTTP 状态码>
    business_code: <code>
    business_message: "<message>"

  validation_fail:
    description: "<异常处理器类名.方法名，处理 @Validated 校验失败异常>"
    status_code: <HTTP 状态码>
    business_code: <code>
    # business_message: 来自 DTO 校验注解的 message 属性（经 i18n 解析），见下方 i18n_map
    # 校验异常处理器通常从异常对象中提取 defaultMessage 或 constraintViolation.message 作为 business_message

  business_fail:
    description: "<异常处理器类名.方法名，处理业务异常>"
    status_code: <HTTP 状态码>
    business_code: <code，若从异常对象中动态获取则标注 'dynamic'>
    # business_message: 从 Service 层 throw 语句或异常对象的 message 追踪

  # 以下为常见的额外错误场景，按需保留或删除
  missing_path_variable:
    description: "<异常处理器，处理缺少路径变量>"
    status_code: <HTTP 状态码>
    business_code: <code>
    business_message_pattern: "<message 模板，{name} 为占位符>"

  type_mismatch:
    description: "<异常处理器，处理参数类型不匹配>"
    status_code: <HTTP 状态码>
    business_code: <code>
    business_message_pattern: "<message 模板>"

  not_found:
    description: "<异常处理器，处理 404>"
    status_code: <HTTP 状态码>
    business_code: <code>
    business_message: "<message>"

  # 以下为可选场景（若项目中检测到则保留，无则删除）
  repeat_submit:
    status_code: <HTTP 状态码>
    business_code: <code>
    business_message: "<防重提交提示消息>"

  rate_limiter:
    status_code: <HTTP 状态码>
    business_code: <code>
    business_message: "<限流提示消息>"

# --------------------------------------------------
# 5. i18n 消息映射（Phase A5 从 properties 文件解析）
#    格式："<i18n_key>": "<翻译文本>"
#    至少覆盖 DTO 校验注解 message 属性和业务异常中出现的所有 key
# --------------------------------------------------
i18n_map: {}
  # "<i18n_key_1>": "<翻译文本>"
  # "<i18n_key_2>": "<带参数模板文本，{0}/{min}/{max} 等>"

# --------------------------------------------------
# 6. 模块路由清单（Phase A2 产出，Phase B Agent 逐模块处理）
# --------------------------------------------------
# 每条路由的字段：
#   method:       HTTP 方法 (GET/POST/PUT/DELETE/PATCH)
#   path:         完整路径（类级 @RequestMapping + 方法级 @XxxMapping）
#   controller:   Controller 文件名
#   return_type:  R（通用包装）| TableDataInfo（分页）| void（无响应体）| 其他
#   auth_required: true（需认证）| false（免认证）
#   request_body_dto: @RequestBody 参数的 DTO 全限定名，无则 null
#   note: 补充说明
#   expected: 预期用例数（Phase A2 步骤4 预计算，Phase B Agent 数量目标）
#   scene_chain: 场景链标记（Phase A2 步骤5 识别），无链则为 null。结构：{type: "create"|"update"|"delete"|"query", chain_id: "<module>-<resource>", depends_on_create: true|false}
#     - type="create": POST 创建接口，Agent 必须生成 extract
#     - type="update/delete": PUT/DELETE 接口，Agent 必须依赖 create 的 extract
#     - chain_id: 同一链的所有接口共享此 ID

modules: {}
  # <module_key>:
  #   name: "<模块中文名>"
  #   base_url: "<当前环境 base_url>"
  #   routes:
  #     - { method: GET,  path: /xxx/list,    controller: XxxController.java, return_type: TableDataInfo, auth_required: true,  auth_probe_code: 200, response_structure: paginated, request_body_dto: XxxBo, note: "分页查询",
  #         expected: { min_positive: 1, min_negative: 1, ideal_positive: 2, ideal_negative: 3 }, scene_chain: null }
  #     - { method: POST, path: /xxx,         controller: XxxController.java, return_type: R,            auth_required: true,  auth_probe_code: null,   response_structure: single,   request_body_dto: XxxBo, note: "新增",
  #         expected: { min_positive: 1, min_negative: 4, ideal_positive: 2, ideal_negative: 7 },
  #         scene_chain: { type: "create", chain_id: "system-post" } }
  #     - { method: PUT,  path: /xxx,         controller: XxxController.java, return_type: R,            auth_required: true,  auth_probe_code: null,   response_structure: empty,    request_body_dto: XxxBo, note: "修改",
  #         expected: { min_positive: 0, min_negative: 3, ideal_positive: 1, ideal_negative: 5 },
  #         scene_chain: { type: "update", chain_id: "system-post", depends_on_create: true } }
  #     - { method: DELETE, path: /xxx/{ids}, controller: XxxController.java, return_type: R,            auth_required: true,  auth_probe_code: null,   response_structure: empty,    request_body_dto: null,  note: "删除",
  #         expected: { min_positive: 0, min_negative: 2, ideal_positive: 1, ideal_negative: 3 },
  #         scene_chain: { type: "delete", chain_id: "system-post", depends_on_create: true } }
  # auth_probe_code: 无 token 探测请求返回的实际 business_code，null 表示未探测

# --------------------------------------------------
# 7. DTO/VO 字段索引（Phase A3b 预计算，Phase B Agent 直接使用）
#     按模块组织，每个 DTO/VO 列出全部字段及 JSON 键名
#     Phase B Agent 优先从此处获取字段信息，避免重复读取源码
# --------------------------------------------------
dto_index: {}
  # <module_key>:
  #   dtos:
  #     <DTO简名>:
  #       full_name: "<全限定名>"
  #       fields:
  #         - { java: "userName", json: "userName", required: true,  constraints: "@NotBlank @Length(min=2,max=30)" }
  #         - { java: "email",    json: "email",    required: false, constraints: "@Email" }
  #   vos:
  #     <VO简名>:
  #       fields:
  #         - { java: "id",       json: "id",       type: "Long" }
  #         - { java: "userName", json: "userName", type: "String" }
  #         - { java: "createTime", json: "createTime", type: "Date" }

# --------------------------------------------------
# 8. 环境能力（Phase A 探测填充）
#     标记外部服务的可用性，Phase B 据此条件式生成用例
# --------------------------------------------------
environment:
  capabilities:
    sms: <true | false>          # 短信服务是否可用
    email: <true | false>        # 邮箱功能是否开启
    oss: <true | false>          # OSS 存储是否可用
    workflow: <true | false>     # 工作流引擎是否可用
    # 按实际项目扩展其他外部依赖

# --------------------------------------------------
# 9. 变量与安全规则 → 见 module-agent-prompt.md §0、§4、§6
#     此处不再重复。变量：${token} / ${提取变量} / ${timestamp}。
#     禁止：{var} 占位符、硬编码系统 ID、修改已有账号属性。
# --------------------------------------------------
