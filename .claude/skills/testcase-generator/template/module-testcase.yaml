module: <MODULE>
module_name: "<模块中文名>"

auth:
  type: <从安全框架源码分析得出>
  login_endpoint: <登录接口完整路径>
  token_header: <认证 header 名>
  token_prefix: "<token 前缀，无则空字符串>"
  token_response_path: <token 在登录响应中的 JSONPath>
  response_msg_field: <响应包装类消息字段的 Java 字段名>
  fixture_extracts: {}
  accounts: {}

base_url: <从 config.yaml 读取>

global_headers:
  - name: <header 名>
    value: "<值>"
    required: true
    description: "<说明>"

testcases:
  - id: TC_<MODULE>_001
    title: "<METHOD> <路径>_<条件>_<预期>"
    priority: P0
    tags: [正常, 回归]
    method: POST
    path: /xxx
    description: "<描述>"
    request:
      body:
        field1: "value1"
    expected:
      status_code: 200
      business_code: 200
      business_message: "操作成功"
      data_exists:
        - "field1"
