# 测试用例 YAML 模板
# 完整示例参考: tests/baseline/_workflow/02-analysis-plan/template/testcase-example.yaml

module: <module_name>
module_name: <模块中文名>
generated_at: "<generated_timestamp>"

testcases:
  # ============================================================
  # <API名称> API 测试用例
  # API: <HTTP_METHOD> <PATH>
  # 代码逻辑:
  #   - 成功: CommonResult.success(...), code=200
  #   - 失败: CommonResult.failed(...), code=500
  #   - 校验失败: CommonResult.validateFailed(...), code=404
  #   - 未授权: CommonResult.unauthorized(...), code=401
  # ============================================================
  - id: TC_<MODULE>_<API>_<SEQ>
    api_id: <API_ID>
    title: <测试标题，格式：操作_条件_预期>
    module: <module_name>
    priority: <P0/P1/P2>
    scenario: |
      <测试场景详细描述，包括验证点和代码逻辑>
    preconditions:
      - <前置条件1>
      - <前置条件2>
    test_data:
      <变量名>: "<值或${变量引用}>"
    request:
      method: <GET/POST/PUT/DELETE>
      path: <API路径>
      headers:
        Content-Type: application/json
        Authorization: "Bearer ${token}"
      params:  # 仅GET请求或query参数
        <param_name>: <value>
      body: "${test_data}"  # 或直接写对象
    expected_response:
      # ⚠️ 含冒号(:)的值必须加双引号，如 "exists_and_type: string"
      http_status: <200/400/401/403/404/500>
      business_code: <200/500/404/401>
      message: "<成功消息或错误消息>"
      message_contains: "<错误消息关键词>"  # 二选一
      data:
        <field_name>: "exists_and_type: <string/integer/boolean/array/object>"
    assertions:
      - assert_equal: ["response.status_code", <http_status>]
        description: "协议层：HTTP状态码说明"
      - assert_equal: ["response.json()['code']", <business_code>]
        description: "业务层：code说明"
      - assert_equal: ["response.json()['message']", "<message>"]
        description: "数据层：消息说明"
      - assert_exists: ["response.json()['data']['<field>']"]
        description: "数据层：字段存在性说明"
      - assert_equal: ["response.json()['data']['<field>']", "<value>"]
        description: "数据层：字段值说明"
      - assert_is_type: ["response.json()['data']['<field>']", <list/dict/str/int>]
        description: "数据层：类型说明"
      - assert_in: ["response.status_code", [<status1>, <status2>]]
        description: "协议层：状态码范围说明"
    tags: [<positive/negative>, <smoke/regression>, <security/validation>]

    # ── CRUD Lifecycle（仅写操作用例需要）──
    # CREATE操作: 声明产生的变量供cleanup用例引用
    # produces:
    #   test_entity_id: "response.json()['data']['id']"
    #
    # UPDATE/UPDATE_PASSWORD操作: 声明依赖的前置用例
    # depends_on: TC_X_CREATE_001
    #
    # 清理/还原用例: 标记生命周期阶段
    # execution_order: cleanup        # 确保在最后执行
    # tags: [cleanup, lifecycle]      # 标记为清理用例

# ============================================================
# 断言表达式语法参考
# ============================================================
# | 断言类型       | 示例                                           | 说明           |
# |----------------|----------------------------------------------|----------------|
# | assert_equal   | ["response.status_code", 200]                 | 断言相等        |
# | assert_not_equal | ["response.json()['code']", 200]           | 断言不等        |
# | assert_exists  | ["response.json()['data']['id']"]             | 断言字段存在    |
# | assert_not_empty | ["response.json()['data']['token']"]        | 断言非空        |
# | assert_contains | ["response.json()['message']", "错误"]       | 断言包含字符串  |
# | assert_in      | ["response.status_code", [200, 401]]         | 断言在列表中    |
# | assert_is_type | ["response.json()['data']['list']", list]    | 断言数据类型    |

# ============================================================
# ResultCode 业务状态码参考
# ============================================================
# | ResultCode      | code | message              | 使用场景              |
# |-----------------|------|----------------------|----------------------|
# | SUCCESS         | 200  | 操作成功              | 操作成功              |
# | FAILED          | 500  | 操作失败              | 通用失败              |
# | VALIDATE_FAILED | 404  | 参数检验失败          | 参数校验失败          |
# | UNAUTHORIZED    | 401  | 暂未登录或token已经过期 | 未授权/Token无效      |
# | FORBIDDEN       | 403  | 没有相关权限          | 无权限                |

# ============================================================
# 变量引用说明
# ============================================================
# ${timestamp}       - 当前时间戳，用于生成唯一值
# ${login_token}     - 登录获取的token
# ${admin_token}     - 管理员token
# ${test_user_id}    - 测试创建的用户ID
# ${test_role_id}    - 测试创建的角色ID
