<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 性能测试报告</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;500;600;700&display=swap');

  :root {
    --bg-deep: #0a0e1a;
    --bg-panel: #111827;
    --bg-card: #161d2e;
    --border-subtle: #1e293b;
    --text-primary: #e8edf5;
    --text-secondary: #8896b0;
    --text-muted: #5a6988;
    --accent-blue: #4da8ff;
    --accent-green: #22d695;
    --accent-red: #ff4d6a;
    --accent-amber: #f0a040;
    --accent-purple: #a78bfa;
    --accent-slate: #64748b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', system-ui, sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(77, 168, 255, .06) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(34, 214, 149, .04) 0%, transparent 60%),
      linear-gradient(rgba(14, 18, 30, .97) 1px, transparent 1px),
      linear-gradient(90deg, rgba(14, 18, 30, .97) 1px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
  }

  .container { max-width: 1280px; margin: 0 auto; padding: 32px 24px 64px; }

  .header { text-align: center; padding: 48px 0 40px; position: relative; }
  .header::after {
    content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 80px; height: 3px;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
    border-radius: 2px;
  }
  .header h1 {
    font-size: 2.6rem; font-weight: 700; letter-spacing: -.5px;
    background: linear-gradient(135deg, var(--text-primary) 0%, #b0c4de 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .header .subtitle {
    margin-top: 8px; font-family: 'DM Mono', monospace; font-size: .85rem;
    color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase;
  }

  .summary-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 16px; margin-bottom: 36px;
  }
  .card {
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    border-radius: 16px; padding: 22px 18px; text-align: center;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    cursor: default; position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; opacity: 0;
    transition: opacity .25s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.35); border-color: rgba(255,255,255,.12); }
  .card:hover::before { opacity: 1; }
  .card.total::before { background: var(--accent-blue); }
  .card.passed::before { background: var(--accent-green); }
  .card.failed::before { background: var(--accent-red); }
  .card.rate::before { background: var(--accent-purple); }
  .card.time::before { background: var(--accent-blue); }
  .card.errors::before { background: var(--accent-amber); }

  .card-icon { font-size: 1.5rem; margin-bottom: 6px; }
  .card.total .card-icon { color: var(--accent-blue); }
  .card.passed .card-icon { color: var(--accent-green); }
  .card.failed .card-icon { color: var(--accent-red); }
  .card.rate .card-icon { color: var(--accent-purple); }
  .card.time .card-icon { color: var(--accent-blue); }
  .card.errors .card-icon { color: var(--accent-amber); }

  .card-value { font-size: 2rem; font-weight: 700; letter-spacing: -.5px; font-family: 'DM Mono', 'Outfit', monospace; }
  .card.total .card-value { color: var(--accent-blue); }
  .card.passed .card-value { color: var(--accent-green); }
  .card.failed .card-value { color: var(--accent-red); }
  .card.rate .card-value { color: var(--accent-purple); }
  .card.time .card-value { font-size: 1.5rem; color: var(--text-primary); }
  .card.errors .card-value { font-size: 1.5rem; color: var(--accent-amber); }
  .card-label { font-size: .82rem; color: var(--text-secondary); margin-top: 4px; font-weight: 500; }

  .section {
    background: var(--bg-panel); border: 1px solid var(--border-subtle);
    border-radius: 20px; padding: 28px 32px; margin-bottom: 36px;
  }
  .section-heading { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; }

  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .chart-wrap { position: relative; height: 300px; }
  @media (max-width: 768px) { .charts-row { grid-template-columns: 1fr; } }

  table { width: 100%; border-collapse: collapse; font-size: .82rem; }
  th {
    text-align: left; padding: 10px 12px; font-size: .75rem; font-weight: 600;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px;
    border-bottom: 1px solid var(--border-subtle); background: rgba(0,0,0,.15);
    white-space: nowrap;
  }
  td { padding: 10px 12px; border-bottom: 1px solid rgba(30, 41, 59, .5); color: var(--text-secondary); }
  td.num { font-family: 'DM Mono', monospace; }
  td.id { font-family: 'DM Mono', monospace; color: var(--accent-blue); }
  td.title { max-width: 320px; white-space: normal; }
  .case-title { font-weight: 600; color: var(--text-primary); line-height: 1.45; }
  td.method { color: var(--accent-purple); font-weight: 600; }
  td.vio { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--accent-red); }

  tr.row-pass td { background: rgba(34, 214, 149, .03); }
  tr.row-fail td { background: rgba(255, 77, 106, .05); }
  tr.row-pass, tr.row-fail { cursor: pointer; }
  tr.row-pass:hover td, tr.row-fail:hover td { background: rgba(77, 168, 255, .07); }

  /* ── 场景详情面板（说明/请求/负载/阈值对比） ── */
  tr.perf-detail-row td { background: rgba(10, 14, 26, .5); padding: 14px 18px; }
  .perf-detail { font-size: .84rem; line-height: 1.7; }
  .perf-detail .d-section { margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px dashed rgba(30, 41, 59, .6); }
  .perf-detail .d-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .perf-detail .d-title {
    font-size: .76rem; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    color: var(--accent-blue); margin-bottom: 8px;
  }
  .perf-detail .d-desc { color: var(--text-secondary); }
  .perf-detail .fail-text { color: var(--accent-red); }
  .perf-detail .d-steps { list-style: none; }
  .perf-detail .d-steps li { margin-bottom: 8px; color: var(--text-secondary); }
  .perf-detail .d-steps pre, .perf-detail pre {
    background: rgba(0,0,0,.3); border: 1px solid var(--border-subtle); border-radius: 8px;
    padding: 10px 14px; margin-top: 4px; font-family: 'DM Mono', monospace; font-size: .78rem;
    color: var(--text-secondary); white-space: pre-wrap; word-break: break-all;
    max-height: 240px; overflow-y: auto;
  }
  .perf-detail .d-req {
    display: inline-block; padding: 1px 10px; border-radius: 6px;
    background: rgba(167, 139, 250, .15); color: var(--accent-purple);
    font-family: 'DM Mono', monospace; font-size: .8rem; margin-right: 8px;
  }
  .perf-detail .d-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
  .perf-detail .d-table td { padding: 5px 10px; border-bottom: 1px solid rgba(30, 41, 59, .5); }
  .perf-detail .d-table td.d-k { width: 110px; font-family: 'DM Mono', monospace; color: var(--accent-amber); }
  .perf-detail .t-pass { color: var(--accent-green); font-weight: 600; }
  .perf-detail .t-fail { color: var(--accent-red); font-weight: 600; }

  .badge {
    display: inline-block; padding: 3px 12px; border-radius: 12px;
    font-size: .78rem; font-weight: 600; letter-spacing: .3px; white-space: nowrap;
  }
  .badge-passed { background: rgba(34, 214, 149, .15); color: var(--accent-green); }
  .badge-failed { background: rgba(255, 77, 106, .15); color: var(--accent-red); }

  .table-wrap { overflow-x: auto; }

  .footer {
    text-align: center; margin-top: 48px; padding-top: 24px;
    border-top: 1px solid var(--border-subtle); color: var(--text-muted);
    font-size: .78rem; font-family: 'DM Mono', monospace;
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>API 性能测试报告</h1>
    <div class="subtitle">{{REPORT_TIME}} &middot; {{SCENARIO_COUNT}} 场景</div>
  </div>

  {{SUMMARY_CARDS}}

  <div class="section">
    <h2 class="section-heading">场景指标明细</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>场景 ID</th>
            <th>标题</th>
            <th>方法</th>
            <th>并发</th>
            <th>时长</th>
            <th>样本</th>
            <th>Avg</th>
            <th>Min</th>
            <th>Max</th>
            <th>P90</th>
            <th>P95</th>
            <th>P99</th>
            <th>RPS</th>
            <th>错误率</th>
            <th>结果</th>
            <th>未达标项</th>
          </tr>
        </thead>
        <tbody>
          {{SCENARIO_TABLE}}
        </tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h2 class="section-heading">各场景 P95 响应时间 (ms)</h2>
    <div class="chart-wrap"><canvas id="p95Chart"></canvas></div>
  </div>

  <div class="section">
    <h2 class="section-heading">各场景吞吐 RPS</h2>
    <div class="chart-wrap"><canvas id="rpsChart"></canvas></div>
  </div>

  <div class="footer">
    Generated by API Perf Runner &middot; JMeter + Chart.js
  </div>

</div>

<script>
function togglePerfDetail(row) {
  const next = row.nextElementSibling;
  if (next && next.classList.contains('perf-detail-row')) {
    next.style.display = next.style.display === 'none' ? '' : 'none';
  }
}

(function initCharts() {
  try {
    if (typeof Chart === 'undefined') return;
    const chartData = {{CHART_DATA}};

    const p95Ctx = document.getElementById('p95Chart');
    if (p95Ctx) {
      new Chart(p95Ctx.getContext('2d'), {
        type: 'bar',
        data: {
          labels: chartData.labels,
          datasets: [{
            label: 'P95 (ms)',
            data: chartData.p95.data,
            backgroundColor: chartData.p95.colors,
            borderRadius: 6,
            borderSkipped: false,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { color: 'rgba(30,41,59,.5)' }, ticks: { color: '#5a6988' } },
            x: { grid: { display: false }, ticks: { color: '#8896b0' } }
          }
        }
      });
    }

    const rpsCtx = document.getElementById('rpsChart');
    if (rpsCtx) {
      new Chart(rpsCtx.getContext('2d'), {
        type: 'bar',
        data: {
          labels: chartData.labels,
          datasets: [{
            label: 'RPS',
            data: chartData.rps,
            backgroundColor: '#4da8ff',
            borderRadius: 6,
            borderSkipped: false,
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, grid: { color: 'rgba(30,41,59,.5)' }, ticks: { color: '#5a6988' } },
            x: { grid: { display: false }, ticks: { color: '#8896b0' } }
          }
        }
      });
    }
  } catch (e) {
    console.warn('Chart init failed:', e.message);
  }
})();
</script>

</body>
</html>
