    request:
      method: "POST"
      url: "/system/tenant"
      body:
        contactUserName: "接口测试联系人QA"
        contactPhone: "13800009999"
        companyName: "接口测试专用租户QA2026"
        username: "qa_tenant_admin_2026"
        password: "admin123"
        packageId: 1
        status: "0"
      auth:
        required: true
        account: "admin"
    extracts:
