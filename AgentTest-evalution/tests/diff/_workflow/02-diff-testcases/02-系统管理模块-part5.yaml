module: "system_part5"
module_name: "系统管理模块-part5"
base_url: "http://localhost:8080"

headers_config:
  public_headers:
    - name: "Content-Type"
      value: "application/json"
  auth_headers:
    - name: "Authorization"
      value: "${auth.token_prefix} ${auth.token}"
    - name: "clientid"
      value: "${auth.params.admin.clientId}"

auth_setup:
  type: bearer_token
  login_endpoint: "/auth/login"
  token_prefix: "Bearer "
  params:
    admin:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
    visitor:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
  accounts:
    admin:
      username: "admin"
      password: "admin123"
    visitor:
      username: "test"
      password: "666666"
  extracts:
    token: "$.data.access_token"

global_variables:
  default_page_size: 10

testcases:
  - id: "TC_SYSTEM_PART5_001"
    title: "GET /system/social/list_正常登录_返回社会化关系列表"
    module: "system_part5"
    tags: [正常, 回归, 冒烟]
    request:
      method: "GET"
      url: "/system/social/list"
      auth:
        required: true
        account: "admin"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["data"]

  - id: "TC_SYSTEM_PART5_002"
    title: "GET /system/social/list_查询异常_返回500"
    module: "system_part5"
    tags: [异常, 回归]
    request:
      method: "GET"
      url: "/system/social/list"
      auth:
        required: true
        account: "admin"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500

  - id: "TC_SYSTEM_PART5_003"
    title: "GET /system/tenant/list_分页查询_返回租户列表"
    module: "system_part5"
    tags: [正常, 回归, 冒烟]
    request:
      method: "GET"
      url: "/system/tenant/list"
      params:
        pageNum: 1
        pageSize: 10
      auth:
        required: true
        account: "admin"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["rows", "total"]

  - id: "TC_SYSTEM_PART5_004"
    title: "GET /system/tenant/list_排序参数有误_返回500"
    module: "system_part5"
    tags: [异常, 回归]
    request:
      method: "GET"
      url: "/system/tenant/list"
      params:
        orderByColumn: "id"
        isAsc: "invalid"
      auth:
        required: true
        account: "admin"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500

  - id: "TC_SYSTEM_PART5_005"
    title: "GET /system/tenant/{id}_主键存在_返回租户详情"
    module: "system_part5"
    tags: [正常, 回归, 冒烟]
    request:
      method: "GET"
      url: "/system/tenant/{id}"
      path:
        id: 1
      auth:
