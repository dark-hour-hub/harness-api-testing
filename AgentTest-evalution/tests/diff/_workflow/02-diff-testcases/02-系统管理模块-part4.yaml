      business_code: 500

  - id: "TC_SYSTEM_PART4_011"
    title: "PUT /system/role/dataScope_传入普通角色_修改数据权限成功"
    method: "PUT"
    path: "/system/role/dataScope"
    tags:
      - "正常"
      - "回归"
    auth:
      required: true
      account: "admin"
    request:
      body:
        roleId: 2
        dataScope: "2"
        deptIds:
          - 100
          - 101
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_SYSTEM_PART4_012"
