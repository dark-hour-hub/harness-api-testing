module: "system_part3"
module_name: "系统管理模块-part3"
base_url: "http://localhost:8080"

headers_config:
  public_headers:
    - name: "Content-Type"
      value: "application/json"
  auth_headers:
    - name: "Authorization"
      value: "${auth.token_prefix} ${auth.token}"
    - name: "clientid"
      value: "${auth.params.admin.clientId}"

auth_setup:
  type: bearer_token
  login_endpoint: "/auth/login"
  token_prefix: "Bearer "
  params:
    admin:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
    visitor:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
  accounts:
    admin:
      username: "admin"
      password: "admin123"
    visitor:
      username: "test"
      password: "666666"
  extracts:
    token: "$.data.access_token"

global_variables:
  default_page_size: 10

testcases:
  - id: "TC_SYSTEM_PART3_001"
    title: "GET /system/menu/getRouters_已登录_返回路由树"
    priority: "P0"
    tags: ["正常", "回归", "冒烟"]
    auth:
      required: true
      account: "admin"
    request:
      method: "GET"
      path: "/system/menu/getRouters"
      params: {}
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["name", "path"]

  - id: "TC_SYSTEM_PART3_002"
    title: "GET /system/menu/getRouters_无菜单权限_返回403"
    priority: "P1"
    tags: ["异常", "回归"]
    auth:
      required: true
      account: "visitor"
    request:
      method: "GET"
      path: "/system/menu/getRouters"
      params: {}
    expected:
      status_code: 200
      response_type: "json"
      business_code: 403

