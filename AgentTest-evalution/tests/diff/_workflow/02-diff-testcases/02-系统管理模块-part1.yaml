      business_code: 500

  - id: "TC_SYSTEM_PART1_011"
    title: "DELETE /system/client/{ids}_删除新建客户端_成功"
    priority: "P0"
    tags: ["正常", "回归"]
    depends_on: ["TC_SYSTEM_PART1_003"]
    request:
      method: "DELETE"
      path: "/system/client/${TC_SYSTEM_PART1_003.extracts.client_id}"
    auth:
      required: true
      account: "admin"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200

  - id: "TC_SYSTEM_PART1_012"
    title: "DELETE /system/client/{ids}_主键为空_业务失败"
    priority: "P1"
    tags: ["异常", "回归"]
    request:
      method: "DELETE"
