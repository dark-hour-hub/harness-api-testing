  # ──────────────────────────────────────────
  # 5. DELETE /api/agents/{id} 删除智能体
  # ──────────────────────────────────────────
  - id: TC_AGENT_015
    title: "DELETE /api/agents/{id}_删除智能体_返回成功"
    priority: P0
    tags: ["正常", "回归"]
    method: DELETE
    path: "/api/agents/{id}"
    description: "验证删除智能体成功，返回 code=200、data 为 null（依赖 TC_AGENT_005 创建、TC_AGENT_012 更新的数据）"
