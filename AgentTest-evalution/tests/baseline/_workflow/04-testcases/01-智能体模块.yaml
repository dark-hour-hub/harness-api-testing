  - id: TC_AGENT_013
    title: "PUT /api/agents/{id}_id不存在_返回404"
    priority: P1
    tags: ["异常", "回归"]
    method: PUT
    path: "/api/agents/{id}"
    description: "验证更新不存在的 Agent ID 时返回 404 COMMON_404_RESOURCE"
