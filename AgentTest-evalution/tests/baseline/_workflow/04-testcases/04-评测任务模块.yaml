  - id: "TC_TASK_024"
    title: "GET /api/evaluation-tasks/{id}/case-results_passed非法值_返回400校验错误"
    priority: P1
    tags: ["异常", "回归"]
    method: GET
    path: "/api/evaluation-tasks/${TC_TASK_001.extracts.task_id}/case-results"
    description: "验证 passed 过滤参数仅接受 true/false，非法值返回 COMMON_400_VALIDATION"
    auth:
      required: false
    request:
      query:
        page: 1
        pageSize: 20
        passed: "yes"
    expected:
      status_code: 400
      response_type: json
      business_code: "COMMON_400_VALIDATION"
      business_message: "Validation failed"
      data_exists: []
    depends_on:
      - "TC_TASK_001"

  # ========== 接口 13：分页查询智能体调用记录 ==========
  - id: "TC_TASK_025"
