      - "TC_TASK_001"

  - id: "TC_TASK_022"
    title: "GET /api/evaluation-tasks/{id}/results/indicators_status非法值_返回400校验错误"
    priority: P1
    tags: ["异常", "回归"]
    method: GET
    path: "/api/evaluation-tasks/${TC_TASK_001.extracts.task_id}/results/indicators"
    description: "验证指标结果 status 过滤参数仅接受合法枚举，非法值返回 COMMON_400_VALIDATION"
    auth:
      required: false
    request:
      query:
        page: 1
        pageSize: 20
        status: "DONE"
