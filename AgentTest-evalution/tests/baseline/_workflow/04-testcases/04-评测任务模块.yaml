  # ========== 接口 12：分页查询用例结果 ==========
  - id: "TC_TASK_023"
    title: "GET /api/evaluation-tasks/{id}/case-results_分页查询用例结果_返回分页数据"
    priority: P0
    tags: ["正常", "回归"]
    method: GET
    path: "/api/evaluation-tasks/${TC_TASK_001.extracts.task_id}/case-results"
    description: "验证分页查询持久化用例判定结果，仅要求任务存在，返回 PageResult 结构"
    auth:
      required: false
    request:
      query:
        page: 1
        pageSize: 20
    expected:
