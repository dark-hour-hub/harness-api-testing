module: task
module_name: "评测任务模块"
base_url: "http://localhost:8080"

headers_config:
  public_headers:
    - name: "Content-Type"
      value: "application/json"

scenarios:
  - id: PERF_TASK_001
    title: "GET /api/evaluation-tasks_100并发_60s"
    priority: P0
    method: GET
    path: "/api/evaluation-tasks"
    description: "验证任务分页列表查询在 100 并发下的响应时间与吞吐"
    auth:
      required: false
    request:
      query:
        page: 1
        pageSize: 10
    load:
      users: 100
      ramp_up: 10
      duration: 60
    thresholds:
      p95: 800
      error_rate: 0.01
      min_rps: 30

  - id: PERF_TASK_002
    title: "POST /api/evaluation-tasks_50并发_60s"
    priority: P1
    method: POST
    path: "/api/evaluation-tasks"
    description: "验证创建评测任务在 50 并发下的响应时间与吞吐"
    auth:
      required: false
    request:
      body:
        agentId: 1
        schemeId: 17
        createdBy: "perf"
    load:
      users: 50
      ramp_up: 5
      duration: 60
    thresholds:
      p95: 800
      error_rate: 0.01
      min_rps: 20

  - id: PERF_TASK_003
    title: "GET /api/evaluation-tasks/{id}_50并发_60s"
    priority: P1
    method: GET
    path: "/api/evaluation-tasks/{id}"
    description: "验证任务详情查询在 50 并发下的响应时间与吞吐"
    auth:
      required: false
    request:
      path_params:
        id: "1"
    load:
      users: 50
      ramp_up: 5
      duration: 60
    thresholds:
      p95: 800
      error_rate: 0.01
      min_rps: 30

  - id: PERF_TASK_004
    title: "GET /api/evaluation-tasks/{id}/progress_20并发_30s"
    priority: P2
    method: GET
    path: "/api/evaluation-tasks/{id}/progress"
    description: "验证任务进度查询在 20 并发下的响应时间与吞吐"
    auth:
      required: false
    request:
      path_params:
        id: "1"
    load:
      users: 20
      ramp_up: 3
      duration: 30
    thresholds:
      p95: 800
      error_rate: 0.01
      min_rps: 30
