module: scheme
module_name: "评测方案模块"
base_url: "http://localhost:8080"

headers_config:
  public_headers:
    - name: "Content-Type"
      value: "application/json"

scenarios:
  - id: PERF_SCHEME_001
    title: "GET /api/evaluation-schemes_100并发_60s"
    priority: P0
    method: GET
    path: "/api/evaluation-schemes"
    description: "分页查询评测方案列表，验证 100 并发下的响应时间与吞吐"
    auth:
      required: false
    request:
      query:
        page: 1
        pageSize: 10
    load:
      users: 100
      ramp_up: 10
      duration: 60
    thresholds:
      p95: 800
      error_rate: 0.01
      min_rps: 30

  - id: PERF_SCHEME_002
    title: "POST /api/evaluation-schemes_50并发_60s"
    priority: P1
    method: POST
    path: "/api/evaluation-schemes"
    description: "创建评测方案草稿，验证 50 并发写入下的响应时间与吞吐"
    auth:
      required: false
    request:
      body:
        schemeCode: "PERF_SCHEME_${__RandomString(12,ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789)}"
        schemeName: "压测方案"
        version: "1.0"
        catalogVersion: "V2"
        evaluationMode: "COMPREHENSIVE"
        evaluationType: null
        riskTier: "B"
        thresholdLevel: null
        dimensionWeights:
          weights:
            SAFETY_COMPLIANCE: 0.4
            CAPABILITY: 0.25
            INTENT_UNDERSTANDING: 0.2
            USER_EXPERIENCE: 0.15
        safetyVetoEnabled: true
        stopOnSafetyFailure: true
        scoringConfigJson: "{}"
        categories:
          - categoryId: 101
            required: true
            applicable: true
          - categoryId: 105
            required: true
            applicable: true
          - categoryId: 110
            required: true
            applicable: true
          - categoryId: 114
            required: true
            applicable: true
        indicators:
          - indicatorId: 1001
            required: true
            applicable: true
          - indicatorId: 1011
            required: true
            applicable: true
          - indicatorId: 1031
            required: true
            applicable: true
          - indicatorId: 1048
            required: true
            applicable: true
        testCases:
          - testCaseId: 1
            enabled: true
          - testCaseId: 71
            enabled: true
          - testCaseId: 181
            enabled: true
          - testCaseId: 341
            enabled: true
        createdBy: "perf"
    load:
      users: 50
      ramp_up: 5
      duration: 60
    thresholds:
      p95: 800
      error_rate: 0.01
      min_rps: 20

  - id: PERF_SCHEME_003
    title: "GET /api/evaluation-schemes/{id}_50并发_60s"
    priority: P1
    method: GET
    path: "/api/evaluation-schemes/{id}"
    description: "按 ID 查询方案详情，验证 50 并发下的响应时间与吞吐"
    auth:
      required: false
    request:
      path_params:
        id: "17"
    load:
      users: 50
      ramp_up: 5
      duration: 60
    thresholds:
      p95: 800
      error_rate: 0.01
      min_rps: 30

  - id: PERF_SCHEME_004
    title: "POST /api/evaluation-schemes/{id}/validate_20并发_30s"
    priority: P2
    method: POST
    path: "/api/evaluation-schemes/{id}/validate"
    description: "校验评测方案草稿完整性，验证 20 并发下的响应时间与吞吐"
    auth:
      required: false
    request:
      path_params:
        id: "48049"
    load:
      users: 20
      ramp_up: 3
      duration: 30
    thresholds:
      p95: 800
      error_rate: 0.01
      min_rps: 20