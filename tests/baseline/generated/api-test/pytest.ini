[pytest]
testpaths = .
python_files = test_*.py
timeout = 60

markers =
    smoke: 冒烟测试 — 核心功能快速验证
    regression: 回归测试 — 主要功能全覆盖
    security: 安全测试 — 认证/权限验证
    positive: 正向用例 — 正常业务逻辑
    negative: 反向用例 — 异常处理验证
    validation: 参数校验 — 必填项/格式校验
    boundary: 边界值测试 — 极限值输入
    P0: 核心路径 — 必须通过
    P1: 主要功能 — 正常场景
    P2: 非关键细节 — 边界条件
    cleanup: 清理用例 — 测试数据清理
    lifecycle: 生命周期 — CRUD配套清理

addopts = -v --tb=short --strict-markers
