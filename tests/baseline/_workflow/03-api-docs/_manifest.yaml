      - part: 6
        file: "02-系统管理-part6.md"
        description: "租户管理 + 租户套餐 + 社会化关系"
        route_prefixes: ["/system/tenant", "/system/tenant/package", "/system/social"]
        interface_count: 20
      - part: 7
