        summary: 获取部门树列表
        response_type: R<List<Tree<Long>>>
        response_structure: list
        auth: true
        permission: "system:post:list"
      # === /system/dict/type ===
      - method: GET
        path: /system/dict/type/list
        summary: 查询字典类型列表
        response_type: TableDataInfo<SysDictTypeVo>
        response_structure: page
        auth: true
        permission: "system:dict:list"
      - method: POST
        path: /system/dict/type/export
        summary: 导出字典类型列表
        response_type: void (文件下载)
        response_structure: file
        auth: true
        permission: "system:dict:export"
      - method: GET
        path: /system/dict/type/{dictId}
        summary: 查询字典类型详细
        response_type: R<SysDictTypeVo>
        response_structure: single
        auth: true
        permission: "system:dict:query"
      - method: POST
        path: /system/dict/type
        summary: 新增字典类型
        request_body: SysDictTypeBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:dict:add"
      - method: PUT
