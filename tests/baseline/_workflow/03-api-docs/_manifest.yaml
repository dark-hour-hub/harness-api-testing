        summary: 刷新字典缓存
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:dict:remove"
      - method: GET
        path: /system/dict/type/optionselect
        summary: 获取字典选择框列表
        response_type: R<List<SysDictTypeVo>>
        response_structure: list
        auth: true
        permission: null
      # === /system/dict/data ===
      - method: GET
        path: /system/dict/data/list
        summary: 查询字典数据列表
        response_type: TableDataInfo<SysDictDataVo>
        response_structure: page
        auth: true
        permission: "system:dict:list"
      - method: POST
        path: /system/dict/data/export
        summary: 导出字典数据列表
        response_type: void (文件下载)
        response_structure: file
        auth: true
        permission: "system:dict:export"
      - method: GET
        path: /system/dict/data/{dictCode}
        summary: 查询字典数据详细
        response_type: R<SysDictDataVo>
        response_structure: single
        auth: true
        permission: "system:dict:query"
      - method: GET
        path: /system/dict/data/type/{dictType}
        summary: 根据字典类型查询字典数据
        response_type: R<List<SysDictDataVo>>
        response_structure: list
