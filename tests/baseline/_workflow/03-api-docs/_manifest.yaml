system:
  name: "RuoYi-Vue-Plus"
  base_url: "http://localhost:8080"
  framework: "Spring Boot 3.5.15 / Java 21 / Sa-Token 1.45.0 + JWT"
  database: "MySQL 8.0 + MyBatis-Plus 3.5.16 + HikariCP/Druid"
  cache: "Redis + Caffeine (Sa-Token 二级缓存)"
  api_doc: "SpringDoc OpenAPI 2.8.17"
  auth_type: "Sa-Token JWT Simple"
  auth_header: "Authorization: Bearer {token}"
  encryption: "登录/注册接口 @ApiEncrypt (全局 API 加解密关闭)"

response_wrapper:
  class: R
  code_field: code
  msg_field: msg
  success_code: 200
  fail_code: 500
  warn_code: 601
  page_class: TableDataInfo
  page_rows_field: rows
  page_total_field: total

test_accounts:
  - role: admin
    username: admin
    password: admin123
    clientId: e5cd7e4891bf95d1d19206ce24a7b32e
    grantType: password
    tenantId: "000000"
    description: 超级管理员，拥有所有权限

auth:
  white_list:
    - "/*.html"
    - "/**/*.html"
    - "/**/*.css"
    - "/**/*.js"
    - "/favicon.ico"
    - "/error"
    - "/*/api-docs"
    - "/*/api-docs/**"
    - "/warm-flow-ui/config"
    - "/resource/sse"
    - "/auth/**"
  public_headers:
    - name: Content-Type
      type: String
      required: true
      example: application/json
  auth_headers:
    - name: Authorization
      type: String
      required: true
      example: "Bearer eyJhbG..."
    - name: clientid
      type: String
      required: true
      example: e5cd7e4891bf95d1d19206ce24a7b32e

permission_model:
  type: RBAC
  super_admin: "admin (userId=1, role: super_admin)"
  format: "{模块}:{资源}:{操作}"
  data_permission: 按部门数据权限 (5级: 全部/自定义/本部门/本部门及以下/仅本人)

modules:
  - name: 认证模块
    prefix: /auth
    file: "01-认证模块.md"
    interface_count: 10
    controllers:
      - class: AuthController
        package: org.dromara.web.controller
      - class: CaptchaController
        package: org.dromara.web.controller
    services:
      - class: SysLoginService
        package: org.dromara.system.service.impl
      - class: SysRegisterService
        package: org.dromara.system.service.impl
    dtos: [LoginBody, PasswordLoginBody, SmsLoginBody, EmailLoginBody, XcxLoginBody, SocialLoginBody, RegisterBody]
    vos: [LoginVo, CaptchaVo, LoginTenantVo, TenantListVo]
    routes:
      - method: POST
        path: /auth/login
        summary: 用户登录
        request_body: LoginBody (加密)
        response_type: R<LoginVo>
        response_structure: single
        auth: false
        permission: null
        special: ["@ApiEncrypt"]
      - method: GET
        path: /auth/binding/{source}
        summary: 获取第三方登录跳转URL
        request_body: null
        response_type: R<String>
        response_structure: single
        auth: false
        permission: null
      - method: POST
        path: /auth/social/callback
        summary: 第三方登录回调绑定
        request_body: SocialLoginBody
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: null
      - method: DELETE
        path: /auth/unlock/{socialId}
        summary: 取消第三方授权
        request_body: null
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: null
      - method: POST
        path: /auth/logout
        summary: 退出登录
        request_body: null
        response_type: R<Void>
        response_structure: single
        auth: false
        permission: null
      - method: POST
        path: /auth/register
        summary: 用户注册
        request_body: RegisterBody (加密)
        response_type: R<Void>
        response_structure: single
        auth: false
        permission: null
        special: ["@ApiEncrypt"]
      - method: GET
        path: /auth/tenant/list
        summary: 获取租户列表
        request_body: null
        response_type: R<LoginTenantVo>
        response_structure: single
        auth: false
        permission: null
        special: ["@RateLimiter(60s/20次/IP)"]
      - method: GET
        path: /auth/code
        summary: 生成验证码
        request_body: null
        response_type: R<CaptchaVo>
        response_structure: single
        auth: false
        permission: null
      - method: GET
        path: /resource/sms/code
        summary: 短信验证码
        request_body: null
        response_type: R<Void>
        response_structure: single
        auth: false
        permission: null
        special: ["@RateLimiter(60s/1次/手机号)"]
      - method: GET
        path: /resource/email/code
        summary: 邮箱验证码
        request_body: null
        response_type: R<Void>
        response_structure: single
        auth: false
        permission: null
        special: ["@RateLimiter(60s/1次/邮箱)"]
    split_plan: null

  - name: 系统管理
    prefix: /system
    file: "02-系统管理.md"
    interface_count: 125
    controllers:
      - class: SysUserController
        package: org.dromara.system.controller.system
      - class: SysProfileController
        package: org.dromara.system.controller.system
      - class: SysRoleController
        package: org.dromara.system.controller.system
      - class: SysMenuController
        package: org.dromara.system.controller.system
      - class: SysDeptController
        package: org.dromara.system.controller.system
      - class: SysPostController
        package: org.dromara.system.controller.system
      - class: SysDictTypeController
        package: org.dromara.system.controller.system
      - class: SysDictDataController
        package: org.dromara.system.controller.system
      - class: SysNoticeController
        package: org.dromara.system.controller.system
      - class: SysConfigController
        package: org.dromara.system.controller.system
      - class: SysClientController
        package: org.dromara.system.controller.system
      - class: SysTenantController
        package: org.dromara.system.controller.system
      - class: SysTenantPackageController
        package: org.dromara.system.controller.system
      - class: SysSocialController
        package: org.dromara.system.controller.system
      - class: SysOssController
        package: org.dromara.system.controller.system
      - class: SysOssConfigController
        package: org.dromara.system.controller.system
    services:
      - class: SysUserServiceImpl
        package: org.dromara.system.service.impl
      - class: SysRoleServiceImpl
        package: org.dromara.system.service.impl
      - class: SysMenuServiceImpl
        package: org.dromara.system.service.impl
      - class: SysDeptServiceImpl
        package: org.dromara.system.service.impl
      - class: SysPostServiceImpl
        package: org.dromara.system.service.impl
      - class: SysDictTypeServiceImpl
        package: org.dromara.system.service.impl
      - class: SysDictDataServiceImpl
        package: org.dromara.system.service.impl
      - class: SysNoticeServiceImpl
        package: org.dromara.system.service.impl
      - class: SysConfigServiceImpl
        package: org.dromara.system.service.impl
      - class: SysClientServiceImpl
        package: org.dromara.system.service.impl
      - class: SysTenantServiceImpl
        package: org.dromara.system.service.impl
      - class: SysTenantPackageServiceImpl
        package: org.dromara.system.service.impl
      - class: SysSocialServiceImpl
        package: org.dromara.system.service.impl
      - class: SysOssServiceImpl
        package: org.dromara.system.service.impl
    routes:
      # === /system/user ===
      - method: GET
        path: /system/user/list
        summary: 获取用户列表
        response_type: TableDataInfo<SysUserVo>
        response_structure: page
        auth: true
        permission: "system:user:list"
      - method: POST
        path: /system/user/export
        summary: 导出用户列表
        response_type: void (文件下载)
        response_structure: file
        auth: true
        permission: "system:user:export"
      - method: POST
        path: /system/user/importData
        summary: 导入用户数据
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:user:import"
      - method: POST
        path: /system/user/importTemplate
        summary: 获取导入模板
        response_type: void (文件下载)
        response_structure: file
        auth: true
        permission: null
      - method: GET
        path: /system/user/getInfo
        summary: 获取当前用户信息
        response_type: R<UserInfoVo>
        response_structure: single
        auth: true
        permission: null
      - method: GET
        path: /system/user/{userId}
        summary: 根据用户编号获取详细信息
        response_type: R<SysUserInfoVo>
        response_structure: single
        auth: true
        permission: "system:user:query"
      - method: POST
        path: /system/user
        summary: 新增用户
        request_body: SysUserBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:user:add"
      - method: PUT
        path: /system/user
        summary: 修改用户
        request_body: SysUserBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:user:edit"
      - method: DELETE
        path: /system/user/{userIds}
        summary: 删除用户
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:user:remove"
      - method: PUT
        path: /system/user/resetPwd
        summary: 重置密码
        request_body: SysUserBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:user:edit"
        special: ["@ApiEncrypt"]
      - method: PUT
        path: /system/user/changeStatus
        summary: 修改用户状态
        request_body: SysUserBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:user:edit"
      - method: GET
        path: /system/user/authRole/{userId}
        summary: 获取用户授权角色
        response_type: R<SysUserInfoVo>
        response_structure: single
        auth: true
        permission: "system:user:query"
      - method: PUT
        path: /system/user/authRole
        summary: 用户授权角色
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:user:edit"
      - method: GET
        path: /system/user/deptTree
        summary: 获取部门树列表
        response_type: R<List<Tree<Long>>>
        response_structure: list
        auth: true
        permission: "system:user:list"
      # === /system/user/profile ===
      - method: GET
        path: /system/user/profile
        summary: 获取个人信息
        response_type: R<ProfileVo>
        response_structure: single
        auth: true
        permission: null
      - method: PUT
        path: /system/user/profile
        summary: 修改个人信息
        request_body: SysUserProfileBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: null
      - method: PUT
        path: /system/user/profile/updatePwd
        summary: 修改个人密码
        request_body: SysUserPasswordBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: null
        special: ["@ApiEncrypt"]
      - method: POST
        path: /system/user/profile/avatar
        summary: 头像上传
        request_body: MultipartFile
        response_type: R<AvatarVo>
        response_structure: single
        auth: true
        permission: null
      # === /system/role ===
      - method: GET
        path: /system/role/list
        summary: 获取角色信息列表
        response_type: TableDataInfo<SysRoleVo>
        response_structure: page
        auth: true
        permission: "system:role:list"
      - method: POST
        path: /system/role/export
