        response_type: R<SysRoleVo>
        response_structure: single
        auth: true
        permission: "system:role:query"
      - method: POST
        path: /system/role
        summary: 新增角色
        request_body: SysRoleBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:role:add"
      - method: PUT
        path: /system/role
        summary: 修改保存角色
        request_body: SysRoleBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:role:edit"
      - method: PUT
        path: /system/role/dataScope
        summary: 修改数据权限
        request_body: SysRoleBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:role:edit"
      - method: PUT
        path: /system/role/changeStatus
        summary: 修改角色状态
        request_body: SysRoleBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:role:edit"
      - method: DELETE
        path: /system/role/{roleIds}
        summary: 删除角色
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:role:remove"
      - method: GET
        path: /system/role/optionselect
        summary: 获取角色选择框列表
        response_type: R<List<SysRoleVo>>
        response_structure: list
        auth: true
        permission: "system:role:query"
      - method: GET
        path: /system/role/authUser/allocatedList
        summary: 查询已分配用户角色列表
        response_type: TableDataInfo<SysUserVo>
        response_structure: page
        auth: true
        permission: "system:role:list"
      - method: GET
        path: /system/role/authUser/unallocatedList
        summary: 查询未分配用户角色列表
        response_type: TableDataInfo<SysUserVo>
        response_structure: page
        auth: true
        permission: "system:role:list"
      - method: PUT
        path: /system/role/authUser/cancel
        summary: 取消授权用户
        request_body: SysUserRole
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:role:edit"
      - method: PUT
        path: /system/role/authUser/cancelAll
        summary: 批量取消授权用户
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:role:edit"
      - method: PUT
        path: /system/role/authUser/selectAll
        summary: 批量选择用户授权
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:role:edit"
      - method: GET
        path: /system/role/deptTree/{roleId}
        summary: 获取对应角色部门树列表
        response_type: R<MenuTreeSelectVo>
        response_structure: single
        auth: true
        permission: "system:role:query"
      # === /system/menu ===
      - method: GET
        path: /system/menu/getRouters
        summary: 获取路由信息
        response_type: R<List<RouterVo>>
        response_structure: list
        auth: true
        permission: null
      - method: GET
        path: /system/menu/list
        summary: 获取菜单列表
        response_type: R<List<SysMenuVo>>
        response_structure: list
        auth: true
        permission: "system:menu:list"
      - method: GET
        path: /system/menu/{menuId}
        summary: 根据菜单编号获取详细信息
        response_type: R<SysMenuVo>
        response_structure: single
        auth: true
        permission: "system:menu:query"
      - method: GET
        path: /system/menu/treeselect
        summary: 获取菜单下拉树列表
        response_type: R<List<Tree<Long>>>
        response_structure: list
        auth: true
        permission: "system:menu:query"
      - method: GET
        path: /system/menu/roleMenuTreeselect/{roleId}
        summary: 加载对应角色菜单列表树
        response_type: R<MenuTreeSelectVo>
        response_structure: single
        auth: true
        permission: "system:menu:query"
      - method: GET
        path: /system/menu/tenantPackageMenuTreeselect/{packageId}
        summary: 加载对应租户套餐菜单列表树
        response_type: R<MenuTreeSelectVo>
        response_structure: single
        auth: true
        permission: "system:menu:query"
      - method: POST
        path: /system/menu
        summary: 新增菜单
        request_body: SysMenuBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:menu:add"
      - method: PUT
        path: /system/menu
        summary: 修改菜单
        request_body: SysMenuBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:menu:edit"
      - method: DELETE
