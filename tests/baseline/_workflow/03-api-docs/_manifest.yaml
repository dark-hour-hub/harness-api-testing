        summary: 删除菜单
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:menu:remove"
      - method: DELETE
        path: /system/menu/cascade/{menuIds}
        summary: 批量级联删除菜单
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:menu:remove"
      # === /system/dept ===
