      - method: POST
        path: /system/post
        summary: 新增岗位
        request_body: SysPostBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:post:add"
      - method: PUT
        path: /system/post
        summary: 修改岗位
        request_body: SysPostBo
        response_type: R<Void>
        response_structure: single
        auth: true
        permission: "system:post:edit"
      - method: DELETE
