    method: "DELETE"
    path: "/workflow/definition/{ids}"
    description: "传入数据库中不存在的流程定义ID列表=99999,99998，验证系统返回业务错误码500。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        ids: "99999,99998"
    expected:
