    priority: "P0"
    tags: ["正常", "回归"]
    method: "PUT"
    path: "/workflow/definition/publish/{id}"
    description: "传入一个已存在且所有BETWEEN类型节点均已配置办理人的流程定义ID，验证发布成功并返回data=true。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        id: 100
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["data"]

  - id: "TC_WF_CATEGORY_024"
    title: "PUT /workflow/definition/publish/{id}_不存在的流程定义ID_返回发布失败"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "PUT"
    path: "/workflow/definition/publish/{id}"
    description: "传入数据库中不存在的流程定义ID=99999尝试发布，验证warm-flow发布失败并返回业务错误码500。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        id: 99999
    expected:
