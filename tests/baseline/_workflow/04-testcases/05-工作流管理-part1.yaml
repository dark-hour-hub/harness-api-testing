  # ============================================================
  # 15. DELETE /workflow/definition/{ids} — 删除流程定义
  # ============================================================
  - id: "TC_WF_CATEGORY_027"
    title: "DELETE /workflow/definition/{ids}_未被使用的流程定义_返回删除成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "DELETE"
