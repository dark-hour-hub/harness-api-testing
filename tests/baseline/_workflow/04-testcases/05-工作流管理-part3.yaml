module: "workflow_task_leave"
module_name: "工作流管理-任务管理+请假示例"
base_url: "http://localhost:8080"
global_variables:
  default_page_size: 10
headers_config:
  public_headers:
    - name: "Content-Type"
      value: "application/json"
  auth_headers:
    - name: "Authorization"
      value: "${auth.token_prefix} ${auth.token}"
    - name: "clientid"
      value: "${auth.params.admin.clientId}"
auth_setup:
  type: bearer_token
  login_endpoint: "/auth/login"
  token_prefix: "Bearer "
  params:
    admin:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
    test:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
  accounts:
    admin:
      username: "admin"
      password: "admin123"
    test:
      username: "test"
      password: "666666"
  extracts:
    token: "$.data.access_token"
testcases:
  # ============================================================
  # 1. POST /workflow/task/startWorkFlow — 启动任务
  # ============================================================
  - id: "TC_WF_TASK_001"
    title: "POST /workflow/task/startWorkFlow_有效流程信息启动任务_返回流程实例和任务ID"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "POST"
    path: "/workflow/task/startWorkFlow"
    description: "使用有效的businessId和已发布的flowCode启动工作流，验证返回流程实例ID和任务ID。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        businessId: "TEST_BIZ_1761024000000"
        flowCode: "leave1"
        variables:
          entity:
            leaveType: "年假"
            startDate: "2026-07-14"
            endDate: "2026-07-16"
            leaveDays: 3
            remark: "测试启动流程"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["processInstanceId", "taskId"]

  - id: "TC_WF_TASK_002"
    title: "POST /workflow/task/startWorkFlow_businessId为空_返回业务ID不能为空"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "POST"
    path: "/workflow/task/startWorkFlow"
    description: "不传businessId启动工作流，验证@NotBlank校验返回业务ID不能为空的错误。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        flowCode: "leave1"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 2. POST /workflow/task/completeTask — 办理任务
  # ============================================================
  - id: "TC_WF_TASK_003"
    title: "POST /workflow/task/completeTask_有效taskId办理任务_返回操作成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "POST"
    path: "/workflow/task/completeTask"
    description: "使用有效taskId办理待办任务（审批通过），验证返回操作成功且推动流程流转。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        taskId: 1
        message: "同意"
        variables:
          auditResult: "PASS"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_WF_TASK_004"
    title: "POST /workflow/task/completeTask_taskId为空_返回任务id不能为空"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "POST"
    path: "/workflow/task/completeTask"
    description: "不传taskId办理任务，验证@NotNull校验返回任务id不能为空的错误。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        message: "同意"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 3. GET /workflow/task/pageByTaskWait — 查询当前用户的待办任务
  # ============================================================
  - id: "TC_WF_TASK_005"
    title: "GET /workflow/task/pageByTaskWait_默认分页查询待办任务_返回待办列表及总数"
    priority: "P0"
    tags: ["正常", "回归", "冒烟"]
    method: "GET"
    path: "/workflow/task/pageByTaskWait"
    description: "默认分页查询当前登录用户的待办任务列表，验证返回rows数组和total总数。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        pageNum: 1
        pageSize: 10
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["rows", "total"]

  - id: "TC_WF_TASK_006"
    title: "GET /workflow/task/pageByTaskWait_分页参数异常_返回空列表或默认分页"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/workflow/task/pageByTaskWait"
    description: "传入非法的pageSize=0分页参数，验证系统能容错处理返回rows和total。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        pageNum: 1
        pageSize: 0
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["rows", "total"]

