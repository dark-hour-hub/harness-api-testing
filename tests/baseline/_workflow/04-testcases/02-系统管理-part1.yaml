  # ============================================================
  # 16. POST /system/user/profile/avatar — 头像上传
  # ============================================================
  - id: "TC_USER_031"
    title: "POST /system/user/profile/avatar_上传有效图片文件_返回头像URL"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "POST"
    path: "/system/user/profile/avatar"
    description: "上传一张有效的PNG格式头像图片，验证系统存储至OSS并返回imgUrl头像地址。"
    auth:
      required: true
      account: "admin"
    request:
      multipart:
        - name: "avatarfile"
          value: "@test_avatar.png"
          content_type: "image/png"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["imgUrl"]

  - id: "TC_USER_032"
    title: "POST /system/user/profile/avatar_上传非图片格式文件_返回文件格式不正确"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "POST"
    path: "/system/user/profile/avatar"
    description: "上传一个文本文件（非图片格式），验证系统返回业务错误码500并提示仅支持bmp/gif/jpg/jpeg/png格式。"
    auth:
      required: true
      account: "admin"
    request:
      multipart:
        - name: "avatarfile"
          value: "@test_document.txt"
          content_type: "text/plain"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []
