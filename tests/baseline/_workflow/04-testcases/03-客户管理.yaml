    expected:
      status_code: 200
      response_type: html
      body_contains:
        - "error"

  # ── 9. POST /owners/{ownerId}/pets/new 新增宠物 ──
  - id: TC_OWNER_017
    title: "POST /owners/{ownerId}/pets/new_提交合法宠物信息_创建成功并重定向"
    priority: P0
