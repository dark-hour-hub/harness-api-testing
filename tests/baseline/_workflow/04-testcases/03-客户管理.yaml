    description: "验证提交完整合法的宠物信息后成功创建并重定向到客户详情页"
    auth:
      required: false
    request:
      body:
        name: "TestPet"
        birthDate: "2024-01-01"
        type: "1"
    expected:
      status_code: 200
      response_type: html
      body_contains:
        - "Owner Information"

  - id: TC_OWNER_018
    title: "POST /owners/{ownerId}/pets/new_name为空_校验失败重定向回表单"
    priority: P1
    tags: ["异常", "回归"]
    method: POST
    path: "/owners/1/pets/new"
    description: "验证宠物名称为空时 @Valid 校验失败，重定向回新增宠物表单页并显示错误"
