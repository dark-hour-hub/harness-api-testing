  # ── 10. GET /owners/{ownerId}/pets/{petId}/edit 编辑宠物表单 ──
  - id: TC_OWNER_019
    title: "GET /owners/{ownerId}/pets/{petId}/edit_访问编辑宠物表单_返回预填充表单"
    priority: P1
    tags: ["正常", "回归"]
    method: GET
    path: "/owners/1/pets/1/edit"
    description: "验证返回编辑宠物页面，表单预填充当前宠物信息及 PetType 列表"
    auth:
      required: false
    request:
      query: {}
    expected:
      status_code: 200
      response_type: html
      body_contains:
        - "Pet"

  - id: TC_OWNER_020
    title: "GET /owners/{ownerId}/pets/{petId}/edit_宠物不存在_返回错误页面"
    priority: P1
    tags: ["异常", "回归"]
    method: GET
    path: "/owners/1/pets/9999/edit"
    description: "验证宠物不存在时返回 error 视图"
    auth:
      required: false
    request:
      query: {}
    expected:
      status_code: 200
      response_type: html
      body_contains:
        - "error"

  # ── 11. POST /owners/{ownerId}/pets/{petId}/edit 更新宠物信息 ──
  - id: TC_OWNER_021
    title: "POST /owners/{ownerId}/pets/{petId}/edit_提交合法更新_更新成功并重定向"
    priority: P0
    tags: ["正常", "回归"]
    method: POST
    path: "/owners/1/pets/1/edit"
    description: "验证提交合法修改后的宠物信息，成功更新并重定向到客户详情页"
    auth:
      required: false
    request:
      body:
        name: "UpdatedPet"
        birthDate: "2024-06-15"
        type: "1"
    expected:
      status_code: 200
      response_type: html
      body_contains:
        - "Owner Information"

  - id: TC_OWNER_022
    title: "POST /owners/{ownerId}/pets/{petId}/edit_name为空_校验失败重定向回表单"
    priority: P1
