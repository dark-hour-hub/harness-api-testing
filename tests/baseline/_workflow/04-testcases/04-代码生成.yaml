- id: TC_GEN_009
  title: POST /tool/gen/importTable_导入有效表结构_返回导入成功
  priority: P0
  tags:
  - 正常
  - 回归
  method: POST
  path: /tool/gen/importTable
  description: 传入有效的表名和数据源名称导入表结构到代码生成配置中，验证返回操作成功。
  auth:
    required: true
    account: admin
  request:
    query:
      dataName: master
      tables: sys_dept,sys_post
  expected:
    status_code: 200
    response_type: json
    business_code: 200
    data_exists: []
- id: TC_GEN_010
