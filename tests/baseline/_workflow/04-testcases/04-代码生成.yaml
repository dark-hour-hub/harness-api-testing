  priority: P1
  tags:
  - 异常
  - 回归
  method: POST
  path: /tool/gen/importTable
  description: 不传tables参数（或传空字符串）调用导入表结构接口，验证系统返回业务错误码500并提示发生未知异常。
  auth:
    required: true
    account: admin
  request:
    query:
      dataName: master
      tables: ''
  expected:
    status_code: 200
    response_type: json
    business_code: 500
    data_exists: []
