module: gen
module_name: 代码生成
base_url: http://localhost:8080
global_variables:
  default_page_size: 10
headers_config:
  public_headers:
  - name: Content-Type
    value: application/json
  auth_headers:
  - name: Authorization
    value: ${auth.token_prefix} ${auth.token}
  - name: clientid
    value: ${auth.params.admin.clientId}
auth_setup:
  type: bearer_token
  login_endpoint: /auth/login
  token_prefix: 'Bearer '
  params:
    admin:
      clientId: e5cd7e4891bf95d1d19206ce24a7b32e
      grantType: password
      tenantId: '000000'
    test:
      clientId: e5cd7e4891bf95d1d19206ce24a7b32e
      grantType: password
      tenantId: '000000'
  accounts:
    admin:
      username: admin
      password: admin123
    test:
      username: test
      password: '666666'
  extracts:
    token: $.data.access_token
testcases:
- id: TC_GEN_001
  title: GET /tool/gen/list_分页查询已导入表配置_返回代码生成列表
  priority: P0
  tags:
  - 正常
  - 回归
  - 冒烟
  method: GET
  path: /tool/gen/list
  description: 使用admin账号分页查询已导入的代码生成配置列表，验证返回正确的分页数据和代码生成表配置信息。
  auth:
    required: true
    account: admin
  request:
    query:
      pageNum: 1
      pageSize: 10
  expected:
    status_code: 200
    response_type: json
    business_code: 200
    data_exists:
    - total
    - rows
- id: TC_GEN_002
  title: GET /tool/gen/list_传入非法排序参数_返回排序参数有误
  priority: P1
  tags:
  - 异常
  - 回归
  method: GET
  path: /tool/gen/list
  description: 传入非法的排序参数验证系统返回业务错误码500并提示排序参数有误。
  auth:
    required: true
    account: admin
  request:
    query:
      pageNum: 1
      pageSize: 10
      orderByColumn: nonExistentColumn
      isAsc: invalid
  expected:
    status_code: 200
    response_type: json
    business_code: 500
    data_exists: []
- id: TC_GEN_003
  title: GET /tool/gen/{tableId}_查询已导入表配置详情_返回表信息和字段列表
  priority: P0
  tags:
  - 正常
  - 回归
  method: GET
  path: /tool/gen/{tableId}
  description: 传入有效tableId查询代码生成业务详情，验证返回表配置信息(info)、字段列表(rows)和全部表信息(tables)。
  auth:
    required: true
    account: admin
  request:
    path_params:
      tableId: 1
  expected:
    status_code: 200
    response_type: json
    business_code: 200
    data_exists:
    - info
    - rows
    - tables
- id: TC_GEN_004
  title: GET /tool/gen/{tableId}_传入不存在的tableId_返回未知异常
  priority: P1
  tags:
  - 异常
  - 回归
  method: GET
  path: /tool/gen/{tableId}
  description: 传入数据库中不存在的tableId查询代码生成业务详情，验证系统返回业务错误码500并提示发生未知异常。
  auth:
    required: true
    account: admin
  request:
    path_params:
      tableId: 99999
  expected:
    status_code: 200
    response_type: json
    business_code: 500
    data_exists: []
