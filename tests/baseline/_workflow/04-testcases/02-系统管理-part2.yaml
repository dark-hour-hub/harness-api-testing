  # 10. GET /system/role/authUser/unallocatedList — 查询未分配用户角色列表
  # ============================================================
  - id: "TC_ROLE_019"
    title: "GET /system/role/authUser/unallocatedList_查询未分配用户列表_返回分页数据"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "GET"
    path: "/system/role/authUser/unallocatedList"
    description: "传入角色ID分页查询尚未分配该角色的用户列表，验证返回分页数据包含rows和total。"
