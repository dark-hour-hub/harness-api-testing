      data_exists: ["checkedKeys", "depts"]

  - id: "TC_ROLE_028"
    title: "GET /system/role/deptTree/{roleId}_传入不存在的角色ID_返回空数据"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/role/deptTree/{roleId}"
    description: "传入系统中不存在的角色ID获取部门树，验证系统返回业务成功但checkedKeys为空数组。"
