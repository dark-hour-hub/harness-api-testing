  - id: "TC_ROLE_020"
    title: "GET /system/role/authUser/unallocatedList_传入不存在的角色ID_返回空列表"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/role/authUser/unallocatedList"
    description: "传入系统中不存在的角色ID查询未分配用户列表，验证系统返回业务成功但rows为空数组。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        roleId: 99999
        pageNum: 1
        pageSize: 10
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["rows", "total"]

  # ============================================================
  # 11. PUT /system/role/authUser/cancel — 取消授权用户
  # ============================================================
  - id: "TC_ROLE_021"
    title: "PUT /system/role/authUser/cancel_取消非当前用户的角色授权_返回取消成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "PUT"
    path: "/system/role/authUser/cancel"
    description: "取消一个非当前登录用户与指定角色的关联，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        userId: 3
        roleId: 2
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_ROLE_022"
    title: "PUT /system/role/authUser/cancel_取消当前登录用户角色_返回不允许修改"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "PUT"
    path: "/system/role/authUser/cancel"
    description: "尝试取消当前登录用户自身与某角色的关联，验证系统返回业务错误不允许修改当前用户角色。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        userId: 1
        roleId: 2
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 12. PUT /system/role/authUser/cancelAll — 批量取消授权用户
  # ============================================================
  - id: "TC_ROLE_023"
    title: "PUT /system/role/authUser/cancelAll_批量取消非当前用户授权_返回取消成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "PUT"
    path: "/system/role/authUser/cancelAll"
    description: "批量取消多个非当前登录用户与指定角色的关联，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        roleId: 2
        userIds: "3,4"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_ROLE_024"
    title: "PUT /system/role/authUser/cancelAll_批量取消包含当前登录用户_返回不允许修改"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "PUT"
    path: "/system/role/authUser/cancelAll"
    description: "批量取消授权时userIds中包含当前登录用户ID，验证系统返回业务错误不允许修改当前用户角色。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        roleId: 2
        userIds: "1,3"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

