module: "system_role"
module_name: "角色管理"
base_url: "http://localhost:8080"
global_variables:
  default_page_size: 10
headers_config:
  public_headers:
    - name: "Content-Type"
      value: "application/json"
  auth_headers:
    - name: "Authorization"
      value: "${auth.token_prefix} ${auth.token}"
    - name: "clientid"
      value: "${auth.params.admin.clientId}"
auth_setup:
  type: bearer_token
  login_endpoint: "/auth/login"
  token_prefix: "Bearer "
  params:
    admin:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
    test:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
  accounts:
    admin:
      username: "admin"
      password: "admin123"
    test:
      username: "test"
      password: "666666"
  extracts:
    token: "$.data.access_token"
testcases:
  # ============================================================
  # 1. GET /system/role/list — 获取角色信息列表
  # ============================================================
  - id: "TC_ROLE_001"
    title: "GET /system/role/list_默认分页查询角色列表_返回分页数据"
    priority: "P0"
    tags: ["正常", "回归", "冒烟"]
    method: "GET"
    path: "/system/role/list"
    description: "使用默认分页参数查询角色信息列表，验证返回分页包裹的角色数据，包含code、msg、rows、total字段。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        pageNum: 1
        pageSize: 10
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["rows", "total"]

  - id: "TC_ROLE_002"
    title: "GET /system/role/list_传入无效排序字段_返回服务器错误"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/role/list"
    description: "传入不存在的SQL排序列名（orderByColumn），验证系统返回业务错误码500或查询失败。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        pageNum: 1
        pageSize: 10
        orderByColumn: "nonexistent_column'"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 2. GET /system/role/{roleId} — 根据角色编号获取详细信息
  # ============================================================
  - id: "TC_ROLE_003"
    title: "GET /system/role/{roleId}_查询存在的角色ID_返回角色详情"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "GET"
    path: "/system/role/{roleId}"
    description: "传入存在的角色ID查询角色详细信息，验证返回roleId、roleName、roleKey、status等完整字段。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        roleId: 1
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["roleId", "roleName"]

  - id: "TC_ROLE_004"
    title: "GET /system/role/{roleId}_传入不存在的角色ID_返回空数据"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/role/{roleId}"
    description: "传入系统中不存在的角色ID，验证系统返回业务成功但data为null或空。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        roleId: 99999
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  # ============================================================
  # 3. POST /system/role — 新增角色
  # ============================================================
  - id: "TC_ROLE_005"
    title: "POST /system/role_填写完整必填字段新增角色_返回新增成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "POST"
    path: "/system/role"
    description: "填写所有必填字段（roleName、roleKey、roleSort）新增一个角色，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        roleName: "自动化测试角色"
        roleKey: "auto_test_role"
        roleSort: 99
        status: "0"
        menuCheckStrictly: false
        deptCheckStrictly: false
        remark: "自动化测试用角色"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_ROLE_006"
    title: "POST /system/role_角色名称已存在_返回新增失败"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "POST"
    path: "/system/role"
    description: "尝试使用已存在的角色名称'超级管理员'新增角色，触发唯一性约束，验证系统返回业务错误（code=500）。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        roleName: "超级管理员"
        roleKey: "test_unique_key"
        roleSort: 99
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 4. PUT /system/role — 修改保存角色
  # ============================================================
  - id: "TC_ROLE_007"
    title: "PUT /system/role_修改普通角色信息_返回修改成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "PUT"
    path: "/system/role"
    description: "传入非超管角色ID及修改后的roleName、roleKey、roleSort，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        roleId: 2
        roleName: "普通角色_测试修改"
        roleKey: "common_test_edit"
        roleSort: 2
        status: "0"
        menuCheckStrictly: false
        deptCheckStrictly: false
        remark: "测试修改后的角色"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_ROLE_008"
    title: "PUT /system/role_修改超级管理员角色_返回不允许操作"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "PUT"
    path: "/system/role"
    description: "尝试修改超级管理员角色（roleId=1）的显示顺序，验证系统返回业务错误不允许操作超级管理员角色。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        roleId: 1
        roleName: "超级管理员"
        roleKey: "superadmin"
        roleSort: 99
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 5. PUT /system/role/dataScope — 修改数据权限
  # ============================================================
  - id: "TC_ROLE_009"
    title: "PUT /system/role/dataScope_修改普通角色数据权限_返回修改成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "PUT"
    path: "/system/role/dataScope"
    description: "传入非超管角色ID及dataScope和deptIds，修改角色的数据权限范围，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        roleId: 2
        dataScope: "2"
        deptIds: [100, 101]
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_ROLE_010"
    title: "PUT /system/role/dataScope_修改超级管理员角色数据权限_返回不允许操作"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "PUT"
    path: "/system/role/dataScope"
    description: "尝试修改超级管理员角色（roleId=1）的数据权限范围，验证系统返回业务错误不允许操作超级管理员角色。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        roleId: 1
        dataScope: "2"
        deptIds: [100]
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 6. PUT /system/role/changeStatus — 修改角色状态
  # ============================================================
  - id: "TC_ROLE_011"
    title: "PUT /system/role/changeStatus_修改普通角色状态_返回修改成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "PUT"
    path: "/system/role/changeStatus"
    description: "传入非超管角色ID及status修改角色启用/停用状态，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        roleId: 2
        status: "0"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_ROLE_012"
    title: "PUT /system/role/changeStatus_修改超级管理员角色状态_返回不允许操作"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "PUT"
    path: "/system/role/changeStatus"
    description: "尝试修改超级管理员角色（roleId=1）的状态为停用，验证系统返回业务错误不允许操作超级管理员角色。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        roleId: 1
        status: "1"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 7. DELETE /system/role/{roleIds} — 删除角色
  # ============================================================
  - id: "TC_ROLE_013"
    title: "DELETE /system/role/{roleIds}_删除非超管角色_返回删除成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "DELETE"
    path: "/system/role/{roleIds}"
    description: "传入非超管角色的ID删除一个未分配用户的角色，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        roleIds: "3"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_ROLE_014"
    title: "DELETE /system/role/{roleIds}_删除超级管理员角色_返回不允许操作"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "DELETE"
    path: "/system/role/{roleIds}"
    description: "尝试删除超级管理员角色（roleId=1），验证系统返回业务错误不允许操作超级管理员角色。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        roleIds: "1"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 8. GET /system/role/optionselect — 获取角色选择框列表
  # ============================================================
  - id: "TC_ROLE_015"
    title: "GET /system/role/optionselect_获取全部正常角色列表_返回角色下拉数据"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "GET"
    path: "/system/role/optionselect"
    description: "不传roleIds参数获取所有正常状态的角色下拉选择数据，验证返回数组数据且元素包含roleId、roleName。"
    auth:
      required: true
      account: "admin"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_ROLE_016"
    title: "GET /system/role/optionselect_传入不存在的角色ID_返回空列表"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/role/optionselect"
    description: "传入系统中不存在的角色ID列表，验证系统返回业务成功但data为空数组或仅包含有效角色。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        roleIds: "99999"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  # ============================================================
  # 9. GET /system/role/authUser/allocatedList — 查询已分配用户角色列表
  # ============================================================
  - id: "TC_ROLE_017"
    title: "GET /system/role/authUser/allocatedList_查询已分配用户列表_返回分页数据"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "GET"
    path: "/system/role/authUser/allocatedList"
    description: "传入角色ID分页查询已分配该角色的用户列表，验证返回分页数据包含rows和total。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        roleId: 1
        pageNum: 1
        pageSize: 10
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["rows", "total"]

  - id: "TC_ROLE_018"
    title: "GET /system/role/authUser/allocatedList_传入不存在的角色ID_返回空列表"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/role/authUser/allocatedList"
    description: "传入系统中不存在的角色ID查询已分配用户列表，验证系统返回业务成功但rows为空数组。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        roleId: 99999
        pageNum: 1
        pageSize: 10
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["rows", "total"]

