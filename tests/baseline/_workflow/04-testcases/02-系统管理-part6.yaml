  # ============================================================
  # 17. POST /system/tenant/package — 新增租户套餐
  # ============================================================
  - id: "TC_TENANT_029"
    title: "POST /system/tenant/package_填写完整字段新增套餐_返回新增成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "POST"
    path: "/system/tenant/package"
    description: "填写套餐名称、菜单ID数组和备注新增一个租户套餐，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        packageName: "自动化测试套餐"
        menuIds: [1, 2, 3, 100]
