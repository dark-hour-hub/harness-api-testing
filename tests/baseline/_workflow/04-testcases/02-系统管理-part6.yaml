module: "system-part6"
module_name: "系统管理-租户管理+租户套餐+社会化关系"
base_url: "http://localhost:8080"
global_variables:
  default_page_size: 10
headers_config:
  public_headers:
    - name: "Content-Type"
      value: "application/json"
  auth_headers:
    - name: "Authorization"
      value: "${auth.token_prefix} ${auth.token}"
    - name: "clientid"
      value: "${auth.params.admin.clientId}"
auth_setup:
  type: bearer_token
  login_endpoint: "/auth/login"
  token_prefix: "Bearer "
  params:
    admin:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
    test:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
  accounts:
    admin:
      username: "admin"
      password: "admin123"
    test:
      username: "test"
      password: "666666"
  extracts:
    token: "$.data.access_token"
testcases:
  # ============================================================
  # 1. GET /system/tenant/list — 查询租户列表
  # ============================================================
  - id: "TC_TENANT_001"
    title: "GET /system/tenant/list_默认分页查询租户列表_返回分页数据"
    priority: "P0"
    tags: ["正常", "回归", "冒烟"]
    method: "GET"
    path: "/system/tenant/list"
    description: "使用默认分页参数查询租户列表，验证返回分页包裹的租户数据，包含code、msg、rows、total字段。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        pageNum: 1
        pageSize: 10
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["rows", "total"]

  - id: "TC_TENANT_002"
    title: "GET /system/tenant/list_传入负数pageNum_返回空数据或参数校验失败"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/tenant/list"
    description: "传入负数页码查询租户列表，验证系统对非法分页参数的处理，返回空rows或查询失败。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        pageNum: -1
        pageSize: 10
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  # ============================================================
  # 3. GET /system/tenant/{id} — 获取租户详细信息
  # ============================================================
  - id: "TC_TENANT_003"
    title: "GET /system/tenant/{id}_查询存在的租户ID_返回租户详情"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "GET"
    path: "/system/tenant/{id}"
    description: "传入管理租户的ID查询租户详细信息，验证返回租户的企业名称、联系人、联系电话等完整字段。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        id: 1
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["tenantId", "companyName", "contactUserName"]

  - id: "TC_TENANT_004"
    title: "GET /system/tenant/{id}_传入不存在的租户ID_返回空数据"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/tenant/{id}"
    description: "传入系统中不存在的租户主键ID，验证系统返回业务成功但data为null。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        id: 99999
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  # ============================================================
  # 4. POST /system/tenant — 新增租户
  # ============================================================
  - id: "TC_TENANT_005"
    title: "POST /system/tenant_填写完整必填字段新增租户_返回新增成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "POST"
    path: "/system/tenant"
    description: "填写所有必填字段（contactUserName、contactPhone、companyName、username、password、packageId）新增一个租户，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        contactUserName: "李四"
        contactPhone: "13900139001"
        companyName: "测试科技有限公司"
        username: "admin_test_co"
        password: "Test@12345"
        packageId: 1
        licenseNumber: "91110000MA12345678"
        address: "广东省深圳市南山区科技园"
        domain: "test-co.ruoyi.com"
        intro: "专注于测试服务"
        remark: "自动化测试租户"
        status: "0"
        accountCount: 50
        expireTime: "2027-12-31 23:59:59"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_TENANT_006"
    title: "POST /system/tenant_缺少必填字段companyName_返回校验失败"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "POST"
    path: "/system/tenant"
    description: "新增租户时不传companyName必填字段，验证系统返回校验失败（code=500）且不创建租户。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        contactUserName: "王五"
        contactPhone: "13900139002"
        username: "admin_wangwu"
        password: "Test@12345"
        packageId: 1
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 5. PUT /system/tenant — 修改租户
  # ============================================================
  - id: "TC_TENANT_007"
    title: "PUT /system/tenant_修改租户联系人信息_返回修改成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "PUT"
    path: "/system/tenant"
    description: "传入租户id及必填字段修改租户的联系人姓名和电话，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        id: 2
        tenantId: "T0002"
        contactUserName: "赵六"
        contactPhone: "13900139003"
        companyName: "已有租户公司"
        domain: "existing.ruoyi.com"
        status: "0"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_TENANT_008"
    title: "PUT /system/tenant_修改默认管理租户_返回不允许操作"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "PUT"
    path: "/system/tenant"
    description: "尝试修改默认管理租户（tenantId=000000），验证系统返回业务错误不允许操作管理租户。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        id: 1
        tenantId: "000000"
        contactUserName: "被禁止修改"
        contactPhone: "13800138000"
        companyName: "示例科技有限公司"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 6. PUT /system/tenant/changeStatus — 修改租户状态
  # ============================================================
  - id: "TC_TENANT_009"
    title: "PUT /system/tenant/changeStatus_停用一个租户_返回修改状态成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "PUT"
    path: "/system/tenant/changeStatus"
    description: "传入租户id、tenantId和status=1停用一个租户，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        id: 2
        tenantId: "T0002"
        status: "1"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_TENANT_010"
    title: "PUT /system/tenant/changeStatus_修改管理租户状态_返回不允许操作"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "PUT"
    path: "/system/tenant/changeStatus"
    description: "尝试修改默认管理租户（tenantId=000000）的状态，验证系统返回业务错误不允许操作管理租户。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        id: 1
        tenantId: "000000"
        status: "1"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 7. DELETE /system/tenant/{ids} — 删除租户
  # ============================================================
  - id: "TC_TENANT_011"
    title: "DELETE /system/tenant/{ids}_删除非超管租户_返回删除成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "DELETE"
    path: "/system/tenant/{ids}"
    description: "传入非管理租户的主键ID删除租户，验证返回操作成功且清除租户缓存。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        ids: "2"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_TENANT_012"
    title: "DELETE /system/tenant/{ids}_删除超管租户_返回不允许删除"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "DELETE"
    path: "/system/tenant/{ids}"
    description: "尝试删除默认管理租户（id=1），验证系统返回业务错误超管租户不能删除。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        ids: "1"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 8. GET /system/tenant/dynamic/{tenantId} — 动态切换租户
  # ============================================================
  - id: "TC_TENANT_013"
    title: "GET /system/tenant/dynamic/{tenantId}_切换到有效租户_返回切换成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "GET"
    path: "/system/tenant/dynamic/{tenantId}"
    description: "传入有效租户编号动态切换当前管理员的租户上下文，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        tenantId: "T0001"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_TENANT_014"
    title: "GET /system/tenant/dynamic/{tenantId}_传入不存在的租户编号_返回租户不存在"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/tenant/dynamic/{tenantId}"
    description: "传入系统中不存在的租户编号尝试动态切换，验证系统返回业务错误或租户不存在。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        tenantId: "T9999"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ============================================================
  # 9. GET /system/tenant/dynamic/clear — 清除动态租户
  # ============================================================
  - id: "TC_TENANT_015"
    title: "GET /system/tenant/dynamic/clear_清除动态租户上下文_返回清除成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "GET"
    path: "/system/tenant/dynamic/clear"
    description: "清除当前管理员的动态租户上下文恢复默认租户视图，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_TENANT_016"
    title: "GET /system/tenant/dynamic/clear_重复清除已清除的租户上下文_返回操作成功"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/tenant/dynamic/clear"
    description: "在未设置动态租户或已清除的情况下再次调用清除接口，验证系统幂等处理返回操作成功。"
    auth:
      required: true
      account: "admin"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  # ============================================================
  # 10. GET /system/tenant/syncTenantPackage — 同步租户套餐
  # ============================================================
  - id: "TC_TENANT_017"
    title: "GET /system/tenant/syncTenantPackage_有效租户同步套餐_返回同步成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "GET"
    path: "/system/tenant/syncTenantPackage"
    description: "传入有效租户编号和套餐ID，将套餐菜单权限同步到指定租户，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        tenantId: "T0001"
        packageId: 1
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_TENANT_018"
    title: "GET /system/tenant/syncTenantPackage_不传packageId_返回套餐ID不能为空"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/tenant/syncTenantPackage"
    description: "仅传tenantId不传packageId调用同步套餐接口，验证系统返回参数校验错误套餐ID不能为空。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        tenantId: "T0001"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

