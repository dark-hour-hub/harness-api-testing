    auth:
      required: true
      account: "admin"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_TENANT_020"
    title: "GET /system/tenant/syncTenantDict_非超管角色调用_返回权限不足"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/tenant/syncTenantDict"
    description: "使用普通管理员账号（非superadmin角色）调用同步字典接口，验证系统返回权限不足。"
    auth:
      required: true
      account: "test"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 403
      data_exists: []

  # ============================================================
  # 12. GET /system/tenant/syncTenantConfig — 同步租户参数配置
  # ============================================================
  - id: "TC_TENANT_021"
