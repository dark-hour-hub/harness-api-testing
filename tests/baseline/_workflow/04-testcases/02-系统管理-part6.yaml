  - id: "TC_TENANT_022"
    title: "GET /system/tenant/syncTenantConfig_非超管角色调用_返回权限不足"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/tenant/syncTenantConfig"
    description: "使用普通管理员账号（非superadmin角色）调用同步参数配置接口，验证系统返回权限不足。"
    auth:
