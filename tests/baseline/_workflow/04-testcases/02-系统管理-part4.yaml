    priority: "P1"
    tags: ["异常", "回归"]
    method: "POST"
    path: "/system/dict/type"
    description: "新增字典类型时不传必填字段dictName，验证系统返回DTO校验失败错误（code=500），不创建字典类型记录。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        dictType: "test_missing_name"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

