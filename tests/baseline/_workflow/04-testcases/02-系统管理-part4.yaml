module: "system-post-dict"
module_name: "系统管理-岗位管理+字典管理"
base_url: "http://localhost:8080"
global_variables:
  default_page_size: 10
headers_config:
  public_headers:
    - name: "Content-Type"
      value: "application/json"
  auth_headers:
    - name: "Authorization"
      value: "${auth.token_prefix} ${auth.token}"
    - name: "clientid"
      value: "${auth.params.admin.clientId}"
auth_setup:
  type: bearer_token
  login_endpoint: "/auth/login"
  token_prefix: "Bearer "
  params:
    admin:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
    test:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
  accounts:
    admin:
      username: "admin"
      password: "admin123"
    test:
      username: "test"
      password: "666666"
  extracts:
    token: "$.data.access_token"
testcases:
  # ============================================================
  # 一、岗位管理
  # ============================================================

  # ----------------------------------------------------------
  # 1. GET /system/post/list — 获取岗位列表
  # ----------------------------------------------------------
  - id: "TC_POST_001"
    title: "GET /system/post/list_正常分页查询岗位列表_返回分页数据和岗位字段"
    priority: "P0"
    tags: ["正常", "回归", "冒烟"]
    method: "GET"
    path: "/system/post/list"
    description: "使用默认分页参数查询岗位列表，验证返回TableDataInfo分页包裹的rows和total字段，列表元素包含postId、postName、postCode、status等字段。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        pageNum: 1
        pageSize: 10
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["rows", "total"]

  - id: "TC_POST_002"
    title: "GET /system/post/list_传入无效分页参数_返回参数绑定异常"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/post/list"
    description: "传入无效的pageNum参数值'abc'触发参数类型转换异常，验证系统返回业务错误码500。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        pageNum: "abc"
        pageSize: 10
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ----------------------------------------------------------
  # 3. GET /system/post/{postId} — 根据岗位编号获取详细信息
  # ----------------------------------------------------------
  - id: "TC_POST_003"
    title: "GET /system/post/{postId}_查询存在的岗位ID_返回岗位完整信息"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "GET"
    path: "/system/post/{postId}"
    description: "传入存在的岗位ID查询岗位详情，验证返回R<SysPostVo>包含postId、postName、postCode、deptId、status等字段。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        postId: 1
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["postId", "postName", "postCode", "deptId", "status"]

  - id: "TC_POST_004"
    title: "GET /system/post/{postId}_查询不存在的岗位ID_返回data为null"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/post/{postId}"
    description: "传入系统中不存在的岗位ID（99999），验证系统返回业务成功但data为null。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        postId: 99999
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ----------------------------------------------------------
  # 4. POST /system/post — 新增岗位
  # ----------------------------------------------------------
  - id: "TC_POST_005"
    title: "POST /system/post_填写完整必填字段新增岗位_返回新增成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "POST"
    path: "/system/post"
    description: "填写所有必填字段（deptId、postCode、postName、postSort）新增一个岗位，同时填写可选字段postCategory、status、remark，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        deptId: 103
        postCode: "test_post_auto"
        postName: "测试岗位"
        postCategory: "tech"
        postSort: 99
        status: "0"
        remark: "自动化测试新增的岗位"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_POST_006"
    title: "POST /system/post_缺少必填字段deptId_返回校验失败"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "POST"
    path: "/system/post"
    description: "新增岗位时不传必填字段deptId，验证系统返回DTO校验失败错误（code=500），不创建岗位记录。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        postCode: "test_missing_dept"
        postName: "缺失部门岗位"
        postSort: 1
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ----------------------------------------------------------
  # 5. PUT /system/post — 修改岗位
  # ----------------------------------------------------------
  - id: "TC_POST_007"
    title: "PUT /system/post_修改岗位备注信息_返回修改成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "PUT"
    path: "/system/post"
    description: "传入postId及完整必填字段修改已有岗位的remark和postSort字段，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        postId: 1
        deptId: 103
        postCode: "ceo"
        postName: "董事长"
        postCategory: "manager"
        postSort: 1
        status: "0"
        remark: "更新后的备注信息"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_POST_008"
    title: "PUT /system/post_缺少必填字段postName_返回校验失败"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "PUT"
    path: "/system/post"
    description: "修改岗位时不传必填字段postName，验证系统返回DTO校验失败（code=500），不执行修改操作。"
    auth:
      required: true
      account: "admin"
    request:
      body:
        postId: 1
        deptId: 103
        postCode: "ceo"
        postSort: 1
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ----------------------------------------------------------
  # 6. DELETE /system/post/{postIds} — 删除岗位
  # ----------------------------------------------------------
  - id: "TC_POST_009"
    title: "DELETE /system/post/{postIds}_删除无用户关联的岗位_返回删除成功"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "DELETE"
    path: "/system/post/{postIds}"
    description: "传入无用户分配的岗位ID进行删除，验证返回操作成功。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        postIds: "5"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  - id: "TC_POST_010"
    title: "DELETE /system/post/{postIds}_传入非数字postIds_返回参数类型错误"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "DELETE"
    path: "/system/post/{postIds}"
    description: "传入非数字的postIds字符串'abc'，触发MethodArgumentTypeMismatchException，验证系统返回参数类型不匹配错误（code=500）。"
    auth:
      required: true
      account: "admin"
    request:
      path_params:
        postIds: "abc"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []

  # ----------------------------------------------------------
  # 7. GET /system/post/optionselect — 获取岗位选择框列表
  # ----------------------------------------------------------
  - id: "TC_POST_011"
    title: "GET /system/post/optionselect_按deptId查询岗位_返回岗位选项列表"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "GET"
    path: "/system/post/optionselect"
    description: "传入deptId按部门筛选岗位选择框列表，验证返回R<List<SysPostVo>>中包含postId、postName、postCode字段。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        deptId: 103
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["postId", "postName", "postCode"]

  - id: "TC_POST_012"
    title: "GET /system/post/optionselect_传入不存在的deptId_返回空列表"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/post/optionselect"
    description: "传入系统中不存在的deptId（0），验证系统返回空列表且不报错，验证边界情况处理。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        deptId: 0
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

  # ----------------------------------------------------------
  # 8. GET /system/post/deptTree — 获取部门树列表
  # ----------------------------------------------------------
  - id: "TC_POST_013"
    title: "GET /system/post/deptTree_查询全部部门树_返回树形结构数据"
    priority: "P0"
    tags: ["正常", "回归"]
    method: "GET"
    path: "/system/post/deptTree"
    description: "不传任何查询参数查询全部部门树结构，验证返回R<List<Tree<Long>>>中包含id、label、children字段的树形数据。"
    auth:
      required: true
      account: "admin"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["id", "label", "children"]

  - id: "TC_POST_014"
    title: "GET /system/post/deptTree_传入不存在的deptId_返回空列表"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "GET"
    path: "/system/post/deptTree"
    description: "传入系统中不存在的deptId（0），验证系统返回空列表且不报错，验证对无效参数的容错处理。"
    auth:
      required: true
      account: "admin"
    request:
      query:
        deptId: 0
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: []

