  # 三、字典数据管理
  # ============================================================

  # ----------------------------------------------------------
  # 17. GET /system/dict/data/list — 查询字典数据列表
  # ----------------------------------------------------------
  - id: "TC_POST_029"
    title: "GET /system/dict/data/list_按字典类型分页查询_返回分页数据和字典数据字段"
    priority: "P0"
