module: workflow-instance-spel
module_name: 工作流管理-流程实例+Spel表达式
base_url: http://localhost:8080
global_variables:
  default_page_size: 10
headers_config:
  public_headers:
  - name: Content-Type
    value: application/json
  auth_headers:
  - name: Authorization
    value: ${auth.token_prefix} ${auth.token}
  - name: clientid
    value: ${auth.params.admin.clientId}
auth_setup:
  type: bearer_token
  login_endpoint: /auth/login
  token_prefix: 'Bearer '
  params:
    admin:
      clientId: e5cd7e4891bf95d1d19206ce24a7b32e
      grantType: password
      tenantId: '000000'
    test:
      clientId: e5cd7e4891bf95d1d19206ce24a7b32e
      grantType: password
      tenantId: '000000'
  accounts:
    admin:
      username: admin
      password: admin123
    test:
      username: test
      password: '666666'
  extracts:
    token: $.data.access_token
testcases:
- id: TC_WF_INSTANCE_001
  title: GET /workflow/instance/pageByRunning_默认分页查询_返回运行中流程实例列表
  priority: P0
  tags:
  - 正常
  - 回归
  - 冒烟
  method: GET
  path: /workflow/instance/pageByRunning
  description: 使用管理员账号分页查询正在运行的流程实例（状态包含草稿、待审核、已退回、已撤销），验证返回分页数据。
  auth:
    required: true
    account: admin
  request:
    query:
      pageNum: 1
      pageSize: 10
  expected:
    status_code: 200
    response_type: json
    business_code: 200
    data_exists:
    - rows
    - total
