module: monitor
module_name: 监控管理
base_url: http://localhost:8080
global_variables:
  default_page_size: 10
headers_config:
  public_headers:
  - name: Content-Type
    value: application/json
  auth_headers:
  - name: Authorization
    value: ${auth.token_prefix} ${auth.token}
  - name: clientid
    value: ${auth.params.admin.clientId}
auth_setup:
  type: bearer_token
  login_endpoint: /auth/login
  token_prefix: 'Bearer '
  params:
    admin:
      clientId: e5cd7e4891bf95d1d19206ce24a7b32e
      grantType: password
      tenantId: '000000'
    test:
      clientId: e5cd7e4891bf95d1d19206ce24a7b32e
      grantType: password
      tenantId: '000000'
  accounts:
    admin:
      username: admin
      password: admin123
    test:
      username: test
      password: '666666'
  extracts:
    token: $.data.access_token
testcases:
- id: TC_MONITOR_001
  title: GET /monitor/logininfor/list_分页查询登录日志_返回rows和total
  priority: P0
  tags:
  - 正常
  - 回归
  - 冒烟
  method: GET
  path: /monitor/logininfor/list
  description: 使用admin账号分页查询系统访问记录列表，验证返回分页数据结构包含rows和total。
  auth:
    required: true
    account: admin
  request:
    query:
      pageNum: 1
      pageSize: 10
  expected:
    status_code: 200
    response_type: json
    business_code: 200
    data_exists:
    - rows
    - total
- id: TC_MONITOR_002
  title: GET /monitor/logininfor/list_传入非法排序字段_返回排序参数有误
  priority: P1
  tags:
  - 异常
  - 回归
  method: GET
  path: /monitor/logininfor/list
  description: 传入不符合白名单的orderByColumn参数，验证系统返回500错误码并提示排序参数有误。
  auth:
    required: true
    account: admin
  request:
    query:
      pageNum: 1
      pageSize: 10
      orderByColumn: invalid_field
  expected:
    status_code: 200
    response_type: json
    business_code: 500
    data_exists: []
- id: TC_MONITOR_003
  title: DELETE /monitor/logininfor/{infoIds}_删除存在的登录日志ID_返回操作成功
  priority: P0
  tags:
  - 正常
  - 回归
  method: DELETE
  path: /monitor/logininfor/{infoIds}
  description: 传入一个存在的登录日志ID进行删除，验证系统返回操作成功。
  auth:
    required: true
    account: admin
  request:
    path_params:
      infoIds: '1'
  expected:
    status_code: 200
    response_type: json
    business_code: 200
    data_exists: []
- id: TC_MONITOR_004
  title: DELETE /monitor/logininfor/{infoIds}_删除不存在的登录日志ID_返回操作失败
  priority: P1
  tags:
  - 异常
  - 回归
  method: DELETE
  path: /monitor/logininfor/{infoIds}
  description: 传入一个不存在的登录日志ID（99999）进行删除，验证系统返回500错误码并提示操作失败。
  auth:
    required: true
    account: admin
  request:
    path_params:
      infoIds: '99999'
  expected:
    status_code: 200
    response_type: json
    business_code: 500
    data_exists: []
- id: TC_MONITOR_005
  title: DELETE /monitor/logininfor/clean_清空所有登录日志_返回操作成功
  priority: P0
  tags:
  - 正常
  - 回归
  method: DELETE
  path: /monitor/logininfor/clean
  description: 清空所有系统访问记录（truncate操作），验证系统返回操作成功。该接口带@Lock4j防重锁。
  auth:
    required: true
    account: admin
  expected:
    status_code: 200
    response_type: json
    business_code: 200
    data_exists: []
- id: TC_MONITOR_006
  title: DELETE /monitor/logininfor/clean_并发清理触发防重锁_返回操作失败
  priority: P1
  tags:
  - 异常
  - 回归
  method: DELETE
  path: /monitor/logininfor/clean
  description: 在@Lock4j分布式锁保护下的清理操作被并发调用时，第二次请求获取锁失败，验证系统返回500错误码并提示操作失败。
  auth:
    required: true
    account: admin
  expected:
    status_code: 200
    response_type: json
    business_code: 500
    data_exists: []
- id: TC_MONITOR_007
  title: GET /monitor/logininfor/unlock/{userName}_解锁被锁定用户_返回操作成功
  priority: P0
  tags:
  - 正常
  - 回归
  method: GET
  path: /monitor/logininfor/unlock/{userName}
  description: 解锁一个被锁定（密码错误次数超限）的用户账号，验证系统清除密码错误计数缓存并返回操作成功。
  auth:
    required: true
    account: admin
  request:
    path_params:
      userName: admin
  expected:
    status_code: 200
    response_type: json
    business_code: 200
    data_exists: []
- id: TC_MONITOR_008
  title: GET /monitor/logininfor/unlock/{userName}_解锁不存在的用户_返回操作成功
  priority: P1
  tags:
  - 异常
  - 回归
  method: GET
  path: /monitor/logininfor/unlock/{userName}
  description: 尝试解锁一个不存在的用户账号，验证系统因缓存key不存在仍返回操作成功（幂等设计）。
  auth:
    required: true
    account: admin
  request:
    path_params:
      userName: nonexistent_user_xyz
  expected:
    status_code: 200
    response_type: json
    business_code: 200
    data_exists: []
