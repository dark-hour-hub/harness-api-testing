module: system-part5
module_name: 系统管理-通知公告+参数配置+客户端管理
base_url: http://localhost:8080
global_variables:
  default_page_size: 10
headers_config:
  public_headers:
  - name: Content-Type
    value: application/json
  auth_headers:
  - name: Authorization
    value: ${auth.token_prefix} ${auth.token}
  - name: clientid
    value: ${auth.params.admin.clientId}
auth_setup:
  type: bearer_token
  login_endpoint: /auth/login
  token_prefix: 'Bearer '
  params:
    admin:
      clientId: e5cd7e4891bf95d1d19206ce24a7b32e
      grantType: password
      tenantId: '000000'
    test:
      clientId: e5cd7e4891bf95d1d19206ce24a7b32e
      grantType: password
      tenantId: '000000'
  accounts:
    admin:
      username: admin
      password: admin123
    test:
      username: test
      password: '666666'
  extracts:
    token: $.data.access_token
testcases:
- id: TC_NOTICE_001
  title: GET /system/notice/list_有效分页查询_返回通知公告分页列表
  priority: P0
  tags:
  - 正常
  - 回归
  - 冒烟
  method: GET
  path: /system/notice/list
  description: 使用管理员账号分页查询通知公告列表，验证返回分页数据结构包含rows和total字段。
  auth:
    required: true
    account: admin
  request:
    query:
      pageNum: 1
      pageSize: 10
  expected:
    status_code: 200
    response_type: json
    business_code: 200
    data_exists:
    - rows
    - total
- id: TC_NOTICE_002
  title: GET /system/notice/list_不存在的公告标题筛选_返回空分页列表
  priority: P1
  tags:
  - 异常
  - 回归
  method: GET
  path: /system/notice/list
  description: 使用不存在的公告标题进行筛选查询，验证系统正常返回空分页列表而非报错。
  auth:
    required: true
    account: admin
  request:
    query:
      pageNum: 1
      pageSize: 10
      noticeTitle: 不存在的公告标题XYZ_NOT_FOUND
  expected:
    status_code: 200
    response_type: json
    business_code: 200
    data_exists:
    - rows
    - total
