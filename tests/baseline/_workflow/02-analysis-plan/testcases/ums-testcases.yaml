  - id: TC_UMS_REGISTER_001
    api_id: API_ADMIN_REGISTER
    title: "admin_register_有效参数_注册成功"
    module: ums
    priority: P0
    scenario: |
      正向用例：使用有效的参数注册新用户。
      代码路径: Controller.register() → Service.register() → 检查用户名唯一 → 加密密码 → 插入数据库 → 返回UmsAdmin → CommonResult.success(umsAdmin)
    preconditions:
      - 用户名 testuser_${timestamp} 在系统中不存在
    test_data:
      username: "testuser_${timestamp}"
      password: "Test123456"
      email: "test_${timestamp}@example.com"
      nickName: "测试用户${timestamp}"
      note: "自动化测试创建"
    request:
      method: POST
      path: /admin/register
      headers:
        Content-Type: application/json
      body:
        username: "testuser_${timestamp}"
        password: "Test123456"
        email: "test_${timestamp}@example.com"
        nickName: "测试用户${timestamp}"
        note: "自动化测试创建"
    expected_response:
      http_status: 200
      business_code: 200
      message: "操作成功"
      data:
        id: "exists_and_type: integer"
        username: "testuser_${timestamp}"
    assertions:
      - assert_equal: ["response.status_code", 200]
        description: "协议层：HTTP状态码200"
      - assert_equal: ["response.json()['code']", 200]
        description: "业务层：code=200(SUCCESS)"
      - assert_equal: ["response.json()['message']", "操作成功"]
        description: "数据层：成功消息"
      - assert_exists: ["response.json()['data']['id']"]
        description: "数据层：返回的用户ID存在"
      - assert_equal: ["response.json()['data']['username']", "testuser_${timestamp}"]
        description: "数据层：用户名与请求一致"
    tags: [positive, smoke, regression]
    produces:
      test_user_id: "response.json()['data']['id']"

