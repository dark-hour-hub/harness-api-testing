  - id: TC_UMS_LOGIN_001
    api_id: API_ADMIN_LOGIN
    title: "admin_login_正确用户名密码_登录成功返回token"
    module: ums
    priority: P0
    scenario: |
      正向用例：使用正确的管理员用户名和密码登录，验证返回JWT token和tokenHead。
      代码路径: Controller.login() → Service.login() → 密码验证通过 → generateToken() → return token → Controller封装tokenMap → CommonResult.success(tokenMap)
    preconditions:
      - 管理员账号 macro 已存在
    test_data:
      username: "macro"
      password: "macro123"
    request:
      method: POST
      path: /admin/login
      headers:
        Content-Type: application/json
      body:
        username: "macro"
        password: "macro123"
    expected_response:
      http_status: 200
      business_code: 200
      message: "操作成功"
      data:
        token: "exists_and_type: string"
        tokenHead: "exists_and_type: string"
    assertions:
      - assert_equal: ["response.status_code", 200]
        description: "协议层：HTTP状态码为200"
      - assert_equal: ["response.json()['code']", 200]
        description: "业务层：业务状态码200(SUCCESS)"
      - assert_equal: ["response.json()['message']", "操作成功"]
        description: "数据层：成功消息"
      - assert_exists: ["response.json()['data']['token']"]
        description: "数据层：token字段存在"
      - assert_exists: ["response.json()['data']['tokenHead']"]
        description: "数据层：tokenHead字段存在"
      - assert_is_type: ["response.json()['data']['token']", str]
        description: "数据层：token为字符串类型"
    tags: [positive, smoke, regression]
    produces:
      admin_token: "response.json()['data']['token']"
      tokenHead: "response.json()['data']['tokenHead']"

  - id: TC_UMS_LOGIN_002
    api_id: API_ADMIN_LOGIN
    title: "admin_login_错误密码_返回密码不正确"
    module: ums
    priority: P0
    scenario: |
      反向用例：使用错误密码登录。
      真实错误路径: Controller.login() → Service.login() → passwordEncoder.matches()=false → Asserts.fail("密码不正确") → throw ApiException("密码不正确") → GlobalExceptionHandler.handle() → e.getErrorCode()==null → CommonResult.failed("密码不正确") → code=500
      注意: Controller中的 if(token==null) return validateFailed("用户名或密码错误") 不会执行，因为Service层已抛出异常。
    preconditions:
      - 管理员账号 macro 已存在
    test_data:
      username: "macro"
      password: "wrong_password_123"
    request:
      method: POST
      path: /admin/login
      headers:
        Content-Type: application/json
      body:
        username: "macro"
        password: "wrong_password_123"
    expected_response:
      http_status: 200
      business_code: 500
      message: "密码不正确"
    assertions:
      - assert_equal: ["response.status_code", 200]
        description: "协议层：HTTP状态码200(Spring全局异常处理器返回)"
      - assert_equal: ["response.json()['code']", 500]
        description: "业务层：code=500(FAILED)，Asserts.fail→ApiException→GlobalExceptionHandler"
      - assert_equal: ["response.json()['message']", "密码不正确"]
        description: "数据层：错误消息'密码不正确'，从ApiException message提取"
    tags: [negative, regression, smoke]

  - id: TC_UMS_LOGIN_003
    api_id: API_ADMIN_LOGIN
    title: "admin_login_用户不存在_返回用户名或密码错误"
    module: ums
    priority: P0
    scenario: |
      反向用例：使用不存在的用户名登录。
      错误路径: Controller.login() → Service.login() → loadUserByUsername()抛出UsernameNotFoundException → catch(AuthenticationException) → LOGGER.warn → return null → Controller中token==null → CommonResult.validateFailed("用户名或密码错误") → code=404
    preconditions:
      - 无
    test_data:
      username: "nonexistent_user_2026"
      password: "some_password"
    request:
      method: POST
      path: /admin/login
      headers:
        Content-Type: application/json
      body:
        username: "nonexistent_user_2026"
        password: "some_password"
    expected_response:
      http_status: 200
      business_code: 404
      message: "用户名或密码错误"
    assertions:
      - assert_equal: ["response.status_code", 200]
        description: "协议层：HTTP状态码200"
      - assert_equal: ["response.json()['code']", 404]
        description: "业务层：code=404(VALIDATE_FAILED)，Controller层validateFailed"
      - assert_equal: ["response.json()['message']", "用户名或密码错误"]
        description: "数据层：Controller返回的validateFailed消息"
    tags: [negative, regression]

