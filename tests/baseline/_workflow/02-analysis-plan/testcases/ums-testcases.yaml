      反向用例：旧密码不正确。
      错误路径: Controller → Service.updatePassword() → passwordEncoder.matches(旧密码,库中密码)=false → return -3 → Controller → CommonResult.failed("旧密码错误") → code=500
    preconditions:
      - admin已登录
    test_data:
      admin_token: "${admin_token}"
    request:
      method: POST
      path: /admin/updatePassword
      headers:
        Content-Type: application/json
        Authorization: "Bearer ${admin_token}"
      body:
        username: "macro"
        oldPassword: "wrong_old_password"
        newPassword: "NewPass123"
    expected_response:
      http_status: 200
      business_code: 500
      message: "旧密码错误"
    assertions:
      - assert_equal: ["response.status_code", 200]
        description: "协议层：HTTP状态码200"
      - assert_equal: ["response.json()['code']", 500]
        description: "业务层：code=500(FAILED)"
      - assert_equal: ["response.json()['message']", "旧密码错误"]
        description: "数据层：错误消息"
    tags: [negative, regression, smoke]

  - id: TC_UMS_UPDATE_PASSWORD_002
    api_id: API_ADMIN_UPDATE_PASSWORD
    title: "admin_updatePassword_空newPassword_参数校验失败"
    module: ums
    priority: P0
    scenario: |
      反向用例：新密码为空。
      实际路径: @Validated + @NotEmpty → MethodArgumentNotValidException → GlobalExceptionHandler.handleValidException() → CommonResult.validateFailed(message) → code=404。
      注意: Controller层的@Validated在校验阶段就拦截了，Service.updatePassword()不会被调用。
    preconditions:
      - admin已登录
    test_data:
      admin_token: "${admin_token}"
    request:
      method: POST
      path: /admin/updatePassword
      headers:
        Content-Type: application/json
        Authorization: "Bearer ${admin_token}"
      body:
        username: "macro"
        oldPassword: "macro123"
        newPassword: ""
    expected_response:
      http_status: 200
      business_code: 404
    assertions:
      - assert_equal: ["response.status_code", 200]
        description: "协议层：HTTP状态码200"
      - assert_equal: ["response.json()['code']", 404]
        description: "业务层：code=404(VALIDATE_FAILED)，@Validated参数校验失败"
    tags: [negative, regression]

