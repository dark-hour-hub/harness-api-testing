module: spring-petclinic
version: "3.x"
analyzed_at: "2026-07-10"

auth:
  type: none
  description: "无认证机制"

interceptors:
  - name: LocaleChangeInterceptor
    type: HandlerInterceptor
    path_prefix: "/*"
    description: "仅处理 ?lang= 参数切换语言，无安全功能"

entities:
  BaseEntity:
    properties:
      id: { type: integer }
  NamedEntity:
    extends: BaseEntity
    properties:
      name: { type: string, required: true }
  Person:
    extends: BaseEntity
    properties:
      firstName: { type: string, required: true, maxLength: 30 }
      lastName: { type: string, required: true, maxLength: 30 }
  Owner:
    extends: Person
    properties:
      address: { type: string, required: true }
      city: { type: string, required: true }
      telephone: { type: string, required: true, pattern: "\\d{10}" }
      pets: { type: array, items: { $ref: Pet } }
  Pet:
    extends: NamedEntity
    properties:
      birthDate: { type: string, format: date, required: true }
      type: { $ref: PetType, required: true }
      visits: { type: array, items: { $ref: Visit } }
  PetType:
    extends: NamedEntity
  Visit:
    extends: BaseEntity
    properties:
      date: { type: string, format: date, required: true }
      description: { type: string, required: true }
  Vet:
    extends: Person
    properties:
      specialties: { type: array, items: { $ref: Specialty } }
  Specialty:
    extends: NamedEntity

apis:
  - id: API_WELCOME
    method: GET
    path: /
    module: system
    description: 欢迎首页
    requires_auth: false
    response_type: view

  - id: API_OUPS
    method: GET
    path: /oups
    module: system
    description: 异常演示
    requires_auth: false
    response_type: error
    error:
      exception: RuntimeException
      status: 500

  - id: API_VETS_HTML
    method: GET
    path: /vets.html
    module: vet
    description: 兽医列表（HTML）
    requires_auth: false
    params:
      page: { type: integer, required: false, default: 1 }
    response_type: view

  - id: API_VETS_JSON
    method: GET
    path: /vets
    module: vet
    description: 兽医列表（JSON）
    requires_auth: false
    response_type: json

  - id: API_OWNER_CREATE_FORM
    method: GET
    path: /owners/new
    module: owner
    description: 创建 Owner 表单
    requires_auth: false
    response_type: view

  - id: API_OWNER_CREATE
    method: POST
    path: /owners/new
    module: owner
    description: 创建新 Owner
    requires_auth: false
    request:
      type: object
      required: [firstName, lastName, address, city, telephone]
      properties:
        firstName: { type: string, required: true, maxLength: 30 }
        lastName: { type: string, required: true, maxLength: 30 }
        address: { type: string, required: true }
        city: { type: string, required: true }
        telephone: { type: string, required: true, pattern: "\\d{10}" }
    response_type: redirect

  - id: API_OWNER_FIND_FORM
    method: GET
    path: /owners/find
    module: owner
    description: 查找 Owner 表单
    requires_auth: false
    response_type: view

  - id: API_OWNER_LIST
    method: GET
    path: /owners
    module: owner
    description: 按 lastName 查找 Owner
    requires_auth: false
    params:
      page: { type: integer, required: false, default: 1 }
      lastName: { type: string, required: false }
    response_type: mixed

  - id: API_OWNER_DETAIL
    method: GET
    path: /owners/{ownerId}
    module: owner
    description: Owner 详情
    requires_auth: false
    path_params:
      ownerId: { type: integer, required: true }
    response_type: view
    error_responses:
      - exception: IllegalArgumentException
        message: "Owner not found with id: {ownerId}"

  - id: API_OWNER_EDIT_FORM
    method: GET
    path: /owners/{ownerId}/edit
    module: owner
    description: 编辑 Owner 表单
    requires_auth: false
    path_params:
      ownerId: { type: integer, required: true }
    response_type: view

  - id: API_OWNER_UPDATE
    method: POST
    path: /owners/{ownerId}/edit
    module: owner
    description: 更新 Owner
    requires_auth: false
    path_params:
      ownerId: { type: integer, required: true }
    request:
      type: object
      required: [id, firstName, lastName, address, city, telephone]
      properties:
        id: { type: integer, required: true }
        firstName: { type: string, required: true, maxLength: 30 }
        lastName: { type: string, required: true, maxLength: 30 }
        address: { type: string, required: true }
        city: { type: string, required: true }
        telephone: { type: string, required: true, pattern: "\\d{10}" }
    response_type: redirect

  - id: API_PET_CREATE_FORM
    method: GET
    path: /owners/{ownerId}/pets/new
    module: owner
    description: 创建 Pet 表单
    requires_auth: false
    path_params:
      ownerId: { type: integer, required: true }
    response_type: view

  - id: API_PET_CREATE
    method: POST
    path: /owners/{ownerId}/pets/new
    module: owner
    description: 创建新 Pet
    requires_auth: false
    path_params:
      ownerId: { type: integer, required: true }
    request:
      type: object
      required: [name, birthDate, type]
      properties:
        name: { type: string, required: true }
        birthDate: { type: string, required: true, format: date }
        type: { type: object, required: true }
    response_type: redirect

  - id: API_PET_EDIT_FORM
    method: GET
    path: /owners/{ownerId}/pets/{petId}/edit
    module: owner
    description: 编辑 Pet 表单
    requires_auth: false
    path_params:
      ownerId: { type: integer, required: true }
      petId: { type: integer, required: true }
    response_type: view

  - id: API_PET_UPDATE
    method: POST
    path: /owners/{ownerId}/pets/{petId}/edit
    module: owner
    description: 更新 Pet
    requires_auth: false
    path_params:
      ownerId: { type: integer, required: true }
      petId: { type: integer, required: true }
    request:
      type: object
      required: [id, name, birthDate, type]
      properties:
        id: { type: integer, required: true }
        name: { type: string, required: true }
        birthDate: { type: string, required: true, format: date }
        type: { type: object, required: true }
    response_type: redirect

  - id: API_VISIT_CREATE_FORM
    method: GET
    path: /owners/{ownerId}/pets/{petId}/visits/new
    module: owner
    description: 添加 Visit 表单
    requires_auth: false
    path_params:
      ownerId: { type: integer, required: true }
      petId: { type: integer, required: true }
    response_type: view

  - id: API_VISIT_CREATE
    method: POST
    path: /owners/{ownerId}/pets/{petId}/visits/new
    module: owner
    description: 添加新 Visit
    requires_auth: false
    path_params:
      ownerId: { type: integer, required: true }
      petId: { type: integer, required: true }
    request:
      type: object
      required: [date, description]
      properties:
        date: { type: string, required: true, format: date }
        description: { type: string, required: true }
    response_type: redirect
