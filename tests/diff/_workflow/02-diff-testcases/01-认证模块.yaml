module: "auth"
module_name: "认证模块"
base_url: "http://localhost:8080"
global_variables:
  default_page_size: 10
headers_config:
  public_headers:
    - name: "Content-Type"
      value: "application/json"
  auth_headers:
    - name: "Authorization"
      value: "${auth.token_prefix} ${auth.token}"
    - name: "clientid"
      value: "${auth.params.admin.clientId}"
auth_setup:
  type: bearer_token
  login_endpoint: "/auth/login"
  token_prefix: "Bearer "
  params:
    admin:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
    test:
      clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
      grantType: "password"
      tenantId: "000000"
  accounts:
    admin:
      username: "admin"
      password: "admin123"
    test:
      username: "test"
      password: "666666"
  extracts:
    token: "$.data.access_token"
testcases:
  - id: "TC_AUTH_001"
    title: "POST /auth/login_有效密码凭证登录_返回token"
    priority: "P0"
    tags: ["正常", "回归", "冒烟"]
    method: "POST"
    path: "/auth/login"
    description: "使用有效的管理员账号密码进行登录，验证登录成功后返回access_token和refresh_token。"
    auth:
      required: false
    request:
      body:
        clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
        grantType: "password"
        tenantId: "000000"
        username: "admin"
        password: "admin123"
    extracts:
      token: "$.data.access_token"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 200
      data_exists: ["access_token", "refresh_token"]

  - id: "TC_AUTH_002"
    title: "POST /auth/login_密码错误_返回用户认证失败"
    priority: "P1"
    tags: ["异常", "回归"]
    method: "POST"
    path: "/auth/login"
    description: "使用错误密码尝试登录，验证系统返回业务错误码500并提示密码错误。"
    auth:
      required: false
    request:
      body:
        clientId: "e5cd7e4891bf95d1d19206ce24a7b32e"
        grantType: "password"
        tenantId: "000000"
        username: "admin"
        password: "wrongPassword"
    expected:
      status_code: 200
      response_type: "json"
      business_code: 500
      data_exists: []
